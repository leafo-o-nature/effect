<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>이펙필드 아카데미</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --green:#9CD098;
  --cyan:#94D3E1;
  --blue:#9FB6FC;
  --pink:#ff8fb1;

  --gradient:linear-gradient(
    120deg,
    #9CD098 0%,
    #94D3E1 35%,
    #9FB6FC 70%,
    #94D3E1 85%,
    #9CD098 100%
  );
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  font-family:
    Arial,
    "Noto Sans KR",
    sans-serif;
  color:#222;
}

body{
  background:var(--gradient);
  background-attachment:fixed;
}

/* =========================
   공통 버튼
========================= */

.gradientBtn{
  border:none;
  border-radius:10px;
  padding:10px 16px;
  background:var(--gradient);
  color:#111;
  font-weight:700;
  cursor:pointer;
  transition:.2s;
}

.gradientBtn:hover{
  transform:translateY(-1px);
  filter:brightness(1.03);
}

.gradientBtn:active{
  transform:translateY(0);
}

/* =========================
   잠금 화면
========================= */

#lockScreen{
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  background:var(--gradient);
  z-index:9999;
}

.lockBox{
  width:min(420px,90vw);
  padding:35px;
  background:white;
  border-radius:20px;
  box-shadow:0 15px 40px rgba(0,0,0,.12);
  text-align:center;
}

.lockBox h2{
  margin:0 0 10px;
  font-size:26px;
}

.lockBox p{
  margin:0 0 22px;
  color:#666;
}

.lockInput{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:10px;
  outline:none;
  font-size:15px;
}

.lockInput:focus{
  border-color:#94cde0;
}

.lockButton{
  width:100%;
  margin-top:10px;
}

.errorText{
  min-height:20px;
  margin-top:10px;
  color:#ff6f9d;
  font-size:14px;
  font-weight:600;
}

/* =========================
   메인
========================= */

.mainPage{
  display:none;
  min-height:100vh;
  padding:50px 0;
}

.wrap{
  width:80%;
  max-width:1180px;
  margin:0 auto;
}

.hero{
  text-align:center;
  margin-bottom:28px;
}

.hero h1{
  margin:0;
  color:#000;
  font-size:42px;
  line-height:1.25;
}

.hero p{
  margin:10px 0 0;
  color:#333;
  font-size:16px;
}

/* =========================
   관리자 버튼
========================= */

.adminToggle{
  position:fixed;
  left:0;
  top:50%;
  transform:translateY(-50%);
  width:35px;
  height:70px;
  border:none;
  border-radius:0 12px 12px 0;
  background:var(--gradient);
  font-size:24px;
  cursor:pointer;
  z-index:5000;
  box-shadow:3px 3px 12px rgba(0,0,0,.1);
}

/* =========================
   관리자 패널
========================= */

.adminPanel{
  position:fixed;
  left:-380px;
  top:0;
  width:min(360px,85vw);
  height:100vh;
  padding:25px;
  background:white;
  box-shadow:8px 0 30px rgba(0,0,0,.15);
  z-index:4999;
  overflow-y:auto;
  transition:left .25s ease;
}

.adminPanel.open{
  left:0;
}

.adminPanel h2{
  margin:0 0 20px;
}

.adminSection{
  margin-bottom:25px;
  padding-bottom:22px;
  border-bottom:1px solid #eee;
}

.adminSection:last-child{
  border-bottom:none;
}

.adminSection h3{
  margin:0 0 12px;
  font-size:17px;
}

.adminInput,
.adminTextarea,
.adminSelect{
  width:100%;
  padding:11px;
  margin-bottom:8px;
  border:1px solid #ddd;
  border-radius:9px;
  outline:none;
  font-family:inherit;
}

.adminTextarea{
  min-height:90px;
  resize:vertical;
}

.adminInput:focus,
.adminTextarea:focus,
.adminSelect:focus{
  border-color:#94cfe1;
}

.adminButtons{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.adminButtons button{
  flex:1;
  min-width:90px;
}

/* =========================
   콘텐츠
========================= */

.contentBox{
  padding:25px;
  background:rgba(255,255,255,.88);
  border-radius:18px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:20px;
  flex-wrap:wrap;
}

.path{
  color:#555;
  font-size:14px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.card{
  position:relative;
  min-height:150px;
  padding:20px;
  background:white;
  border:1px solid #eee;
  border-radius:14px;
  box-shadow:0 5px 15px rgba(0,0,0,.05);
  cursor:pointer;
  transition:.2s;
}

.card:hover{
  transform:translateY(-3px);
  box-shadow:0 9px 22px rgba(0,0,0,.09);
}

.folderIcon{
  font-size:42px;
  margin-bottom:12px;
}

.card h3{
  margin:0;
  color:#111;
  font-size:18px;
  word-break:break-word;
}

.cardImage{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  border-radius:10px;
  margin-bottom:12px;
  display:block;
}

.cardImagePlaceholder{
  width:100%;
  aspect-ratio:1/1;
  border-radius:10px;
  margin-bottom:12px;
  background:linear-gradient(135deg,#f4f4f4,#eaeaea);
  display:flex;
  justify-content:center;
  align-items:center;
  color:#aaa;
  font-size:40px;
}

.cardActions{
  position:absolute;
  top:10px;
  right:10px;
  display:flex;
  gap:5px;
}

.smallBtn{
  border:none;
  border-radius:7px;
  padding:5px 8px;
  background:#f1f1f1;
  cursor:pointer;
  font-size:12px;
}

.smallBtn:hover{
  background:#e5e5e5;
}

/* =========================
   모달
========================= */

.modalBg{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.35);
  z-index:6000;
}

.modalBg.show{
  display:flex;
}

.modal{
  width:min(650px,95vw);
  max-height:90vh;
  overflow-y:auto;
  padding:28px;
  background:white;
  border-radius:18px;
  box-shadow:0 20px 50px rgba(0,0,0,.2);
}

.modalHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.modalHeader h2{
  margin:0;
}

.closeBtn{
  border:none;
  background:#eee;
  border-radius:50%;
  width:34px;
  height:34px;
  cursor:pointer;
}

/* =========================
   상세 페이지
========================= */

.detailOverlay{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  padding:5vh 10vw;
  background:rgba(0,0,0,.45);
  z-index:7000;
}

.detailOverlay.show{
  display:flex;
}

.detailPage{
  position:relative;
  width:80vw;
  height:90vh;
  overflow-y:auto;
  padding:40px;
  background:white;
  border-radius:18px;
  box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.detailClose{
  position:absolute;
  top:15px;
  right:15px;
  width:38px;
  height:38px;
  border:none;
  border-radius:50%;
  background:#eee;
  cursor:pointer;
  font-size:18px;
  z-index:2;
}

.detailTitle{
  margin:0 45px 25px 0;
  color:#111;
  font-size:32px;
}

.detailImage{
  width:100%;
  max-height:420px;
  object-fit:contain;
  display:block;
  margin:0 auto 25px;
  border-radius:12px;
  background:#f7f7f7;
}

.infoTable{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
}

.infoTable th,
.infoTable td{
  border:1px solid #ddd;
  padding:12px;
  text-align:left;
  vertical-align:top;
}

.infoTable th{
  width:130px;
  background:#f2f2f2;
  font-weight:700;
}

.extraTitle{
  margin-top:30px;
  padding-bottom:8px;
  border-bottom:2px solid #ddd;
}

.extraText{
  white-space:pre-wrap;
  line-height:1.7;
}

/* =========================
   폼
========================= */

.formGroup{
  margin-bottom:13px;
}

.formGroup label{
  display:block;
  margin-bottom:6px;
  font-weight:700;
  font-size:14px;
}

.formGroup input,
.formGroup textarea,
.formGroup select{
  width:100%;
  padding:11px;
  border:1px solid #ddd;
  border-radius:9px;
  outline:none;
  font-family:inherit;
}

.formGroup textarea{
  min-height:100px;
  resize:vertical;
}

.formGroup input:focus,
.formGroup textarea:focus,
.formGroup select:focus{
  border-color:#94cfe1;
}

.fileInfo{
  font-size:12px;
  color:#777;
  margin-top:5px;
}

/* =========================
   반응형
========================= */

@media(max-width:900px){

  .wrap{
    width:90%;
  }

  .grid{
    grid-template-columns:repeat(2,1fr);
  }

  .hero h1{
    font-size:34px;
  }

  .detailOverlay{
    padding:0;
  }

  .detailPage{
    width:100vw;
    height:100vh;
    border-radius:0;
    padding:30px 20px;
  }

  .detailClose{
    top:12px;
    right:12px;
  }
}

@media(max-width:600px){

  .mainPage{
    padding:35px 0;
  }

  .wrap{
    width:92%;
  }

  .hero h1{
    font-size:29px;
  }

  .hero p{
    font-size:14px;
    line-height:1.5;
  }

  .contentBox{
    padding:16px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .toolbar{
    align-items:stretch;
  }

  .toolbar button{
    width:100%;
  }

  .detailTitle{
    font-size:25px;
  }

  .infoTable th{
    width:90px;
  }

  .infoTable th,
  .infoTable td{
    padding:9px;
    font-size:14px;
  }
}
</style>
</head>

<body>

<!-- =========================
     비밀번호 화면
========================= -->

<div id="lockScreen">

  <div class="lockBox">

    <h2>이펙필드 아카데미</h2>

    <p>입장하려면 비밀번호를 입력하세요.</p>

    <input
      id="passwordInput"
      class="lockInput"
      type="password"
      placeholder="비밀번호"
      autocomplete="off"
    >

    <button
      class="gradientBtn lockButton"
      onclick="unlock()"
    >
      입장
    </button>

    <div
      id="passwordError"
      class="errorText"
    ></div>

  </div>

</div>


<!-- =========================
     메인
========================= -->

<div id="mainPage" class="mainPage">

  <button
    class="adminToggle"
    onclick="toggleAdminPanel()"
  >
    &gt;
  </button>


  <!-- 관리자 패널 -->

  <aside
    id="adminPanel"
    class="adminPanel"
  >

    <h2>관리자</h2>


    <!-- 관리자 로그인 -->

    <div
      id="adminLoginSection"
      class="adminSection"
    >

      <h3>관리자 모드</h3>

      <input
        id="adminPasswordInput"
        class="adminInput"
        type="password"
        placeholder="관리자 비밀번호"
        autocomplete="off"
      >

      <button
        class="gradientBtn"
        onclick="enableAdmin()"
      >
        관리자 모드 시작
      </button>

      <p
        id="adminError"
        class="errorText"
      ></p>

    </div>


    <!-- 관리자 기능 -->

    <div
      id="adminTools"
      style="display:none;"
    >

      <!-- ★ 제목 / 소제목 수정 -->

      <div class="adminSection">

        <h3>사이트 제목 수정</h3>

        <input
          id="siteTitleInput"
          class="adminInput"
          type="text"
          placeholder="사이트 제목"
        >

        <input
          id="siteSubtitleInput"
          class="adminInput"
          type="text"
          placeholder="사이트 소제목"
        >

        <button
          class="gradientBtn"
          onclick="saveSiteInfo()"
        >
          제목 / 소제목 저장
        </button>

      </div>


      <!-- 폴더 -->

      <div class="adminSection">

        <h3>폴더 관리</h3>

        <input
          id="folderNameInput"
          class="adminInput"
          type="text"
          placeholder="새 폴더 이름"
        >

        <button
          class="gradientBtn"
          onclick="createFolder()"
        >
          폴더 만들기
        </button>

      </div>


      <!-- 자료 -->

      <div class="adminSection">

        <h3>자료 관리</h3>

        <button
          class="gradientBtn"
          onclick="openItemModal()"
          style="width:100%;"
        >
          자료 추가
        </button>

      </div>


      <div class="adminSection">

        <button
          class="gradientBtn"
          onclick="disableAdmin()"
          style="width:100%;"
        >
          관리자 모드 종료
        </button>

      </div>

    </div>

  </aside>


  <!-- 헤더 -->

  <main class="wrap">

    <header class="hero">

      <h1 id="siteTitle">
        이펙필드 아카데미
      </h1>

      <p id="siteSubtitle">
        초능력을 올바른 곳에 사용하는 것을 목적으로 하는 다양한 분야의 아카데미
      </p>

    </header>


    <section class="contentBox">

      <div class="toolbar">

        <div
          id="breadcrumb"
          class="path"
        ></div>

        <button
          id="backButton"
          class="gradientBtn"
          onclick="goBack()"
          style="display:none;"
        >
          ← 이전
        </button>

      </div>


      <div
        id="grid"
        class="grid"
      ></div>

    </section>

  </main>

</div>


<!-- =========================
     자료 추가/수정 모달
========================= -->

<div
  id="itemModalBg"
  class="modalBg"
>

  <div class="modal">

    <div class="modalHeader">

      <h2 id="itemModalTitle">
        자료 추가
      </h2>

      <button
        class="closeBtn"
        onclick="closeItemModal()"
      >
        ×
      </button>

    </div>


    <div class="formGroup">
      <label>이름</label>
      <input id="itemName">
    </div>

    <div class="formGroup">
      <label>학년</label>
      <input id="itemGrade">
    </div>

    <div class="formGroup">
      <label>간단 정보</label>
      <textarea id="itemInfo"></textarea>
    </div>

    <div class="formGroup">
      <label>분야</label>
      <input id="itemField">
    </div>

    <div class="formGroup">
      <label>초능력</label>
      <textarea id="itemAbility"></textarea>
    </div>

    <div class="formGroup">
      <label>좋아하는 것</label>
      <textarea id="itemLikes"></textarea>
    </div>

    <div class="formGroup">
      <label>싫어하는 것</label>
      <textarea id="itemDislikes"></textarea>
    </div>

    <div class="formGroup">
      <label>가족관계</label>
      <textarea id="itemFamily"></textarea>
    </div>

    <div class="formGroup">
      <label>이외의 관계</label>
      <textarea id="itemRelations"></textarea>
    </div>

    <div class="formGroup">
      <label>추가 설명</label>
      <textarea id="itemExtra"></textarea>
    </div>

    <div class="formGroup">
      <label>대표 이미지</label>

      <input
        id="itemImage"
        type="file"
        accept="image/*"
      >

      <div class="fileInfo">
        새 이미지를 선택하면 기존 이미지를 교체합니다.
      </div>

    </div>

    <button
      class="gradientBtn"
      onclick="saveItem()"
      style="width:100%;"
    >
      저장
    </button>

  </div>

</div>


<!-- =========================
     상세 페이지
========================= -->

<div
  id="detailOverlay"
  class="detailOverlay"
>

  <div class="detailPage">

    <button
      class="detailClose"
      onclick="closeDetail()"
    >
      ×
    </button>

    <div id="detailContent"></div>

  </div>

</div>


<script>
/* =========================================================
   기본 설정
========================================================= */

const SITE_PASSWORD = "1234";

const ADMIN_PASSWORD = "Leeafnatureminna0103399";


/* =========================================================
   Supabase 설정
========================================================= */

const SUPABASE_URL = "여기에_Project_URL";
const SUPABASE_KEY = "여기에_Publishable_Key";

let supabaseClient = null;


/* =========================================================
   기본 데이터
========================================================= */

let data = {

  site: {
    title: "이펙필드 아카데미",

    subtitle:
      "초능력을 올바른 곳에 사용하는 것을 목적으로 하는 다양한 분야의 아카데미"
  },

  folders: [

    {
      id:"root",
      name:"전체 자료",
      parent:null
    }

  ],

  items:[]

};


let currentFolder = "root";

let adminMode = false;

let editingId = null;


/* =========================================================
   Supabase 초기화
========================================================= */

function initSupabase(){

  if(
    !SUPABASE_URL ||
    !SUPABASE_KEY ||
    SUPABASE_URL.includes("여기에_") ||
    SUPABASE_KEY.includes("여기에_")
  ){

    console.warn(
      "Supabase 설정이 아직 완료되지 않았습니다."
    );

    return false;
  }


  if(
    !window.supabase ||
    !window.supabase.createClient
  ){

    console.error(
      "Supabase 라이브러리를 불러오지 못했습니다."
    );

    return false;
  }


  try{

    supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    return true;

  }catch(error){

    console.error(error);

    return false;
  }

}


/* =========================================================
   비밀번호 입장
========================================================= */

function unlock(){

  const input =
    document.getElementById("passwordInput");

  const error =
    document.getElementById("passwordError");


  if(input.value === SITE_PASSWORD){

    document.getElementById("lockScreen")
      .style.display = "none";

    document.getElementById("mainPage")
      .style.display = "block";

    error.textContent = "";


    if(initSupabase()){

      loadData();

    }else{

      render();

    }

  }else{

    error.textContent =
      "비밀번호가 맞지 않습니다";

    input.value = "";

    input.focus();

  }

}


/* 엔터키 */

document
  .getElementById("passwordInput")
  .addEventListener("keydown",function(e){

    if(e.key === "Enter"){
      unlock();
    }

  });


/* =========================================================
   Supabase 데이터 불러오기
========================================================= */

async function loadData(){

  if(!supabaseClient){

    render();

    return;
  }


  try{

    const {data:row,error} =
      await supabaseClient
        .from("academy_data")
        .select("data")
        .eq("id",1)
        .maybeSingle();


    if(error){

      console.error(error);

      render();

      return;
    }


    if(row && row.data){

      data = row.data;

      /* 이전 버전 데이터와 호환 */

      if(!data.site){

        data.site = {

          title:"이펙필드 아카데미",

          subtitle:
            "초능력을 올바른 곳에 사용하는 것을 목적으로 하는 다양한 분야의 아카데미"

        };

      }

    }


    render();

  }catch(error){

    console.error(error);

    render();

  }

}


/* =========================================================
   데이터 저장
========================================================= */

async function saveData(){

  if(!supabaseClient){

    console.warn(
      "Supabase가 설정되지 않아 데이터가 저장되지 않았습니다."
    );

    return false;
  }


  try{

    const {error} =
      await supabaseClient
        .from("academy_data")
        .upsert(
          {
            id:1,
            data:data
          },
          {
            onConflict:"id"
          }
        );


    if(error){

      console.error(error);

      alert(
        "저장 중 오류가 발생했습니다."
      );

      return false;
    }


    return true;

  }catch(error){

    console.error(error);

    return false;

  }

}


/* =========================================================
   HTML 보안 처리
========================================================= */

function escapeHTML(value){

  if(value === null || value === undefined){
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

/* =========================================================
   폴더 찾기
========================================================= */

function getFolder(id){

  return data.folders.find(
    folder => folder.id === id
  );

}


/* =========================================================
   현재 폴더 경로
========================================================= */

function getBreadcrumb(folderId){

  const result = [];

  let current =
    getFolder(folderId);


  while(current){

    result.unshift(current);

    if(!current.parent){
      break;
    }

    current =
      getFolder(current.parent);

  }


  return result;

}


/* =========================================================
   폴더 만들기
========================================================= */

async function createFolder(){

  if(!adminMode){
    return;
  }


  const input =
    document.getElementById(
      "folderNameInput"
    );


  const name =
    input.value.trim();


  if(!name){

    alert("폴더 이름을 입력해주세요.");

    return;
  }


  data.folders.push({

    id:
      "folder_" +
      Date.now(),

    name:name,

    parent:currentFolder

  });


  input.value = "";


  render();

  await saveData();

}


/* =========================================================
   폴더 이름 수정
========================================================= */

async function renameFolder(id){

  if(!adminMode){
    return;
  }


  if(id === "root"){

    alert("전체 자료 폴더는 수정할 수 없습니다.");

    return;
  }


  const folder =
    getFolder(id);


  if(!folder){
    return;
  }


  const newName =
    prompt(
      "새 폴더 이름",
      folder.name
    );


  if(
    newName === null ||
    !newName.trim()
  ){

    return;
  }


  folder.name =
    newName.trim();


  render();

  await saveData();

}


/* =========================================================
   폴더 삭제
========================================================= */

async function deleteFolder(id){

  if(!adminMode){
    return;
  }


  if(id === "root"){

    alert("전체 자료 폴더는 삭제할 수 없습니다.");

    return;
  }


  const folder =
    getFolder(id);


  if(!folder){
    return;
  }


  const hasChildFolder =
    data.folders.some(
      f => f.parent === id
    );


  const hasItems =
    data.items.some(
      item => item.folder === id
    );


  if(hasChildFolder || hasItems){

    alert(
      "폴더 안에 자료가 있거나 하위 폴더가 있어서 삭제할 수 없습니다."
    );

    return;
  }


  if(
    !confirm(
      `"${folder.name}" 폴더를 삭제할까요?`
    )
  ){

    return;
  }


  data.folders =
    data.folders.filter(
      f => f.id !== id
    );


  if(currentFolder === id){

    currentFolder =
      folder.parent || "root";

  }


  render();

  await saveData();

}

   폴더 열기
========================================================= */

function openFolder(id){

}

  const folder =

/* =========================================================
   이미지 업로드
========================================================= */

async function uploadImage(file){

  if(!supabaseClient){

    alert(
      "Supabase가 설정되지 않아 이미지를 업로드할 수 없습니다."
    );

    return null;
  }


  const extension =
    file.name
      .split(".")
      .pop()
      .toLowerCase();


  const fileName =
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .substring(2) +
    "." +
    extension;


  try{

    const {error} =
      await supabaseClient
        .storage
        .from("academy-images")
        .upload(
          fileName,
          file,
          {
            upsert:false
          }
        );


    if(error){

      console.error(error);

      alert(
        "이미지 업로드에 실패했습니다."
      );

      return null;
    }


    const {data:publicData} =
      supabaseClient
        .storage
        .from("academy-images")
        .getPublicUrl(fileName);


    return publicData.publicUrl;

  }catch(error){

    console.error(error);

    return null;

  }

}


/* =========================================================
   자료 저장
========================================================= */

async function saveItem(){

  if(!adminMode){
    return;
  }


  const name =
    document
      .getElementById("itemName")
      .value
      .trim();


  if(!name){

    alert("이름을 입력해주세요.");

    return;
  }


  let item;


  if(editingId){

    item =
      data.items.find(
        x => x.id === editingId
      );

  }else{

    item = {

      id:
        "item_" +
        Date.now(),

      folder:currentFolder,

      name:""

    };

    data.items.push(item);

  }


  item.name = name;

  item.grade =
    document.getElementById("itemGrade").value.trim();

  item.info =
    document.getElementById("itemInfo").value.trim();

  item.field =
    document.getElementById("itemField").value.trim();

  item.ability =
    document.getElementById("itemAbility").value.trim();

  item.likes =
    document.getElementById("itemLikes").value.trim();

  item.dislikes =
    document.getElementById("itemDislikes").value.trim();

  item.family =
    document.getElementById("itemFamily").value.trim();

  item.relations =
    document.getElementById("itemRelations").value.trim();

  item.extra =
    document.getElementById("itemExtra").value.trim();


  const file =
    document.getElementById("itemImage")
      .files[0];


  if(file){

    const imageUrl =
      await uploadImage(file);


    if(imageUrl){

      item.image =
        imageUrl;

    }

  }


  closeItemModal();

  render();

  await saveData();

}

/* =========================================================
   상세 보기
========================================================= */

function openDetail(id){

  const item =
    data.items.find(
      x => x.id === id
    );


  if(!item){
    return;
  }


  let html = "";


  html += `
    <h1 class="detailTitle">
      ${escapeHTML(item.name)}
    </h1>
  `;


  if(item.image){

    html += `
      <img
        class="detailImage"
        src="${escapeHTML(item.image)}"
        alt="${escapeHTML(item.name)}"
      >
    `;

  }


  const rows = [

    ["학년",item.grade],

    ["간단 정보",item.info],

    ["분야",item.field],

    ["초능력",item.ability],

    ["좋아하는 것",item.likes],

    ["싫어하는 것",item.dislikes],

    ["가족관계",item.family],

    ["이외의 관계",item.relations]

  ];


  const validRows =
    rows.filter(
      row =>
        row[1] !== undefined &&
        row[1] !== null &&
        String(row[1]).trim() !== ""
    );


  if(validRows.length){

    html += `
      <table class="infoTable">
        <tbody>
    `;


    validRows.forEach(row => {

      html += `
        <tr>
          <th>
            ${escapeHTML(row[0])}
          </th>

          <td>
            ${escapeHTML(row[1])}
          </td>
        </tr>
      `;

    });


    html += `
        </tbody>
      </table>
    `;

  }


  if(
    item.extra &&
    item.extra.trim()
  ){

    html += `
      <h2 class="extraTitle">
        추가 설명
      </h2>

      <div class="extraText">
        ${escapeHTML(item.extra)}
      </div>
    `;

  }


  document
    .getElementById("detailContent")
    .innerHTML = html;


  document
    .getElementById("detailOverlay")
    .classList.add("show");

}


/* =========================================================
   상세 닫기
========================================================= */

function closeDetail(){

  document
    .getElementById("detailOverlay")
    .classList.remove("show");

}


/* =========================================================
   화면 렌더링
========================================================= */

function render(){

  applySiteInfo();


  const grid =
    document.getElementById("grid");


  grid.innerHTML = "";


  /* 현재 경로 */

  const breadcrumb =
    getBreadcrumb(currentFolder);


  document
    .getElementById("breadcrumb")
    .innerHTML =
      breadcrumb
        .map(
          (folder,index) => {

            const isLast =
              index === breadcrumb.length - 1;


            if(isLast){

              return `
                <strong>
                  ${escapeHTML(folder.name)}
                </strong>
              `;

            }


            return `
              <span
                style="cursor:pointer;"
                onclick="openFolder('${folder.id}')"
              >
                ${escapeHTML(folder.name)}
              </span>
              <span> / </span>
            `;

          }
        )
        .join("");


  /* 이전 버튼 */

  const current =
    getFolder(currentFolder);


  document
    .getElementById("backButton")
    .style.display =
      current &&
      current.parent
        ? "block"
        : "none";


  /* 하위 폴더 */

  const folders =
    data.folders.filter(
      folder =>
        folder.parent === currentFolder
    );


  folders.forEach(folder => {

    const card =
      document.createElement("div");


    card.className = "card";


    let actions = "";


    if(adminMode){

      actions = `
        <div class="cardActions">

          <button
            class="smallBtn"
            onclick="event.stopPropagation();renameFolder('${folder.id}')"
          >
            수정
          </button>

          <button
            class="smallBtn"
            onclick="event.stopPropagation();deleteFolder('${folder.id}')"
          >
            삭제
          </button>

        </div>
      `;

    }


    card.innerHTML = `

      ${actions}

      <div
        class="folderIcon"
      >
        📁
      </div>

      <h3>
        ${escapeHTML(folder.name)}
      </h3>

    `;


    card.onclick = () =>
      openFolder(folder.id);


    grid.appendChild(card);

  });


  /* 자료 */

  const items =
    data.items.filter(
      item =>
        item.folder === currentFolder
    );


  items.forEach(item => {

    const card =
      document.createElement("div");


    card.className = "card";


    let actions = "";


    if(adminMode){

      actions = `
        <div class="cardActions">

          <button
            class="smallBtn"
            onclick="event.stopPropagation();openItemModal('${item.id}')"
          >
            수정
          </button>

          <button
            class="smallBtn"
            onclick="event.stopPropagation();deleteItem('${item.id}')"
          >
            삭제
          </button>

        </div>
      `;

    }


    let imageHTML;


    if(item.image){

      imageHTML = `
        <img
          class="cardImage"
          src="${escapeHTML(item.image)}"
          alt="${escapeHTML(item.name)}"
        >
      `;

    }else{

      imageHTML = `
        <div class="cardImagePlaceholder">
          ✦
        </div>
      `;

    }


    card.innerHTML = `

      ${actions}

      ${imageHTML}

      <h3>
        ${escapeHTML(item.name)}
      </h3>

    `;


    card.onclick = () =>
      openDetail(item.id);


    grid.appendChild(card);

  });


  /* 아무것도 없을 때 */

  if(
    folders.length === 0 &&
    items.length === 0
  ){

    const empty =
      document.createElement("div");


    empty.style.gridColumn =
      "1 / -1";

    empty.style.textAlign =
      "center";

    empty.style.padding =
      "50px 20px";

    empty.style.color =
      "#888";

    empty.textContent =
      "아직 등록된 자료가 없습니다.";


    grid.appendChild(empty);

  }

}
