<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이펙필드 아카데미</title>

<style>
:root{
  --green:#9CD098;
  --cyan:#94D3E1;
  --blue:#9FB6FC;
  --text:#26334a;
  --sub:#6b7890;
  --border:#dce4ef;
  --white:#ffffff;
  --danger:#e87575;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
}

body{
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans KR",
    "Malgun Gothic",
    sans-serif;
  color:var(--text);
  background:
    linear-gradient(
      135deg,
      rgba(156,208,152,.32) 0%,
      rgba(148,211,225,.32) 25%,
      rgba(159,182,252,.32) 50%,
      rgba(148,211,225,.32) 75%,
      rgba(156,208,152,.32) 100%
    );
  background-attachment:fixed;
}

body.detailOpen{
  overflow:hidden;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

/* =========================
   공통 제목
========================= */

h1,h2,h3,h4{
  color:#111827;
  background:none;
  -webkit-text-fill-color:initial;
}

/* =========================
   잠금 화면
========================= */

#lockScreen{
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    linear-gradient(
      135deg,
      #9CD098,
      #94D3E1,
      #9FB6FC,
      #94D3E1,
      #9CD098
    );
}

.lockBox{
  width:min(420px,100%);
  background:rgba(255,255,255,.94);
  border-radius:22px;
  padding:40px 30px;
  text-align:center;
  box-shadow:0 20px 60px rgba(45,65,90,.18);
}

.lockBox h1{
  margin:0 0 10px;
  font-size:28px;
}

.lockBox p{
  margin:0 0 25px;
  color:var(--sub);
  line-height:1.6;
}

.lockInput{
  width:100%;
  padding:14px 16px;
  border:1px solid var(--border);
  border-radius:12px;
  outline:none;
  background:#fff;
  margin-bottom:10px;
}

.lockInput:focus{
  border-color:#9fb6fc;
}

.primaryBtn{
  border:0;
  color:#fff;
  background:linear-gradient(135deg,var(--green),var(--cyan),var(--blue));
  padding:12px 20px;
  border-radius:11px;
  font-weight:700;
}

.primaryBtn:hover{
  filter:brightness(.97);
}

.errorText{
  color:#d95d5d;
  min-height:20px;
  margin-top:10px;
  font-size:14px;
}

/* =========================
   관리자 버튼 / 패널
========================= */

.adminToggle{
  position:fixed;
  left:0;
  top:50%;
  transform:translateY(-50%);
  z-index:200;
  width:38px;
  height:72px;
  border:0;
  border-radius:0 12px 12px 0;
  background:#fff;
  color:#526078;
  font-size:22px;
  box-shadow:0 4px 20px rgba(50,70,100,.16);
}

.adminPanel{
  position:fixed;
  left:-100%;
  top:0;
  bottom:0;
  z-index:190;
  width:20vw;
  min-width:260px;
  max-width:360px;
  padding:30px 24px;
  background:rgba(255,255,255,.97);
  box-shadow:8px 0 30px rgba(40,60,90,.15);
  transition:left .3s ease;
  overflow-y:auto;
}

.adminPanel.open{
  left:0;
}

.adminPanel h2{
  margin:0 0 8px;
  font-size:21px;
}

.adminPanel p{
  color:var(--sub);
  font-size:14px;
  line-height:1.6;
}

.adminStatus{
  margin:20px 0;
  padding:13px;
  border-radius:12px;
  background:#f4f7fb;
  font-size:14px;
}

.adminStatus strong{
  color:#4e8d69;
}

.adminInput{
  width:100%;
  padding:12px;
  border:1px solid var(--border);
  border-radius:10px;
  outline:none;
  margin-bottom:8px;
}

.adminButtons{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.adminButtons button{
  border:0;
  border-radius:9px;
  padding:9px 13px;
  background:#edf2f7;
  color:#425069;
}

.adminButtons .adminLogin{
  background:linear-gradient(135deg,var(--green),var(--cyan));
  color:white;
  font-weight:700;
}

.adminButtons .adminLogout{
  background:#f5dddd;
  color:#a44d4d;
}

/* =========================
   메인
========================= */

main{
  min-height:100vh;
}

.wrap{
  width:80%;
  max-width:1180px;
  margin:0 auto;
  padding:45px 0 80px;
}

.brand{
  font-size:17px;
  font-weight:800;
  color:#111827;
  margin-bottom:20px;
}

.hero{
  padding:35px 0 30px;
}

.hero h1{
  margin:0 0 14px;
  font-size:clamp(32px,5vw,58px);
  letter-spacing:-2px;
  color:#111827;
}

.hero p{
  margin:0;
  max-width:700px;
  color:#5d6a80;
  line-height:1.8;
  font-size:15px;
}

.toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  padding:17px 20px;
  margin-bottom:20px;
  background:rgba(255,255,255,.78);
  border:1px solid rgba(255,255,255,.8);
  border-radius:15px;
  box-shadow:0 5px 25px rgba(60,80,110,.07);
}

.toolbar h2{
  margin:0;
  font-size:19px;
}

.breadcrumb{
  color:var(--sub);
  font-size:13px;
}

.createPanel{
  display:none;
  margin-bottom:25px;
  padding:22px;
  border-radius:16px;
  background:rgba(255,255,255,.9);
  border:1px solid var(--border);
}

.createPanel.active{
  display:block;
}

.createPanel h2{
  margin:0 0 15px;
  font-size:18px;
}

.createButtons{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.createButtons button{
  border:0;
  border-radius:10px;
  padding:11px 16px;
  background:#eef3f8;
  color:#43516a;
}

.createButtons .mainCreate{
  background:linear-gradient(135deg,var(--green),var(--cyan));
  color:#fff;
  font-weight:700;
}

/* =========================
   카드
========================= */

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:20px;
}

.card{
  overflow:hidden;
  border-radius:16px;
  background:rgba(255,255,255,.93);
  border:1px solid rgba(220,228,239,.9);
  box-shadow:0 8px 25px rgba(55,75,105,.08);
  transition:
    transform .2s ease,
    box-shadow .2s ease;
}

.card:hover{
  transform:translateY(-3px);
  box-shadow:0 13px 30px rgba(55,75,105,.13);
}

.thumb{
  width:100%;
  aspect-ratio:1 / 1;
  background:#f0f3f7;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  cursor:pointer;
}

.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.noImage{
  color:#a5afbd;
  font-size:13px;
}

.cardbody{
  padding:15px;
}

.cardTitle{
  margin:0;
  font-size:16px;
  font-weight:800;
  color:#111827;
  cursor:pointer;
  word-break:break-word;
}

.cardFolder{
  margin-top:5px;
  color:#8994a6;
  font-size:12px;
}

.cardactions{
  display:flex;
  gap:7px;
  margin-top:12px;
}

.cardactions button{
  border:0;
  padding:7px 10px;
  border-radius:8px;
  background:#edf2f7;
  color:#526078;
  font-size:12px;
}

.cardactions .deleteBtn{
  background:#f8e2e2;
  color:#a84f4f;
}

.empty{
  grid-column:1 / -1;
  text-align:center;
  padding:70px 20px;
  color:#8b96a7;
  background:rgba(255,255,255,.6);
  border-radius:16px;
}

/* =========================
   모달
========================= */

.modalBg{
  position:fixed;
  inset:0;
  z-index:500;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(30,42,60,.42);
}

.modalBg.show{
  display:flex;
}

.modal{
  width:min(700px,100%);
  max-height:90vh;
  overflow-y:auto;
  background:white;
  border-radius:18px;
  padding:25px;
  box-shadow:0 20px 70px rgba(30,45,70,.25);
}

.modal h3{
  margin:0 0 20px;
  font-size:21px;
}

.formGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.row{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.row.full{
  grid-column:1 / -1;
}

.row label{
  font-size:13px;
  font-weight:700;
  color:#59667a;
}

.row input,
.row textarea,
.row select{
  width:100%;
  border:1px solid var(--border);
  border-radius:10px;
  padding:11px 12px;
  outline:none;
  background:#fff;
}

.row textarea{
  min-height:100px;
  resize:vertical;
}

.row input:focus,
.row textarea:focus,
.row select:focus{
  border-color:#9fb6fc;
}

.preview{
  margin-top:10px;
  max-width:180px;
  max-height:180px;
  border-radius:10px;
  object-fit:cover;
  display:none;
}

.modalfoot{
  display:flex;
  justify-content:flex-end;
  gap:9px;
  margin-top:22px;
}

.modalfoot button{
  border:0;
  border-radius:10px;
  padding:10px 15px;
}

.cancelBtn{
  background:#edf1f5;
  color:#536076;
}

.saveBtn{
  background:linear-gradient(135deg,var(--green),var(--cyan),var(--blue));
  color:white;
  font-weight:700;
}

/* =========================
   상세 페이지 오버레이
========================= */

.detailOverlay{
  position:fixed;
  inset:0;
  z-index:450;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(27,39,56,.45);
}

.detailOverlay.show{
  display:flex;
}

.detailPage{
  position:relative;
  width:80vw;
  height:90vh;
  overflow-y:auto;
  background:#fff;
  border-radius:12px;
  box-shadow:0 25px 80px rgba(25,40,65,.28);
}

.detailClose{
  position:fixed;
  top:calc(5vh + 15px);
  right:calc(10vw + 15px);
  z-index:480;
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.95);
  color:#354258;
  font-size:24px;
  line-height:1;
  box-shadow:0 5px 20px rgba(30,45,70,.15);
}

.detailHeader{
  padding:45px 55px 25px;
  border-bottom:1px solid #e8edf3;
}

.detailHeader h2{
  margin:0 0 10px;
  font-size:34px;
  color:#111827;
  word-break:break-word;
}

.detailHeader p{
  margin:0;
  color:#8993a3;
  font-size:13px;
}

.detailImageWrap{
  padding:35px 55px 10px;
  text-align:center;
}

.detailImage{
  max-width:100%;
  max-height:55vh;
  object-fit:contain;
  border-radius:10px;
}

.detailContent{
  padding:20px 55px 55px;
}

.infoTable{
  width:100%;
  border-collapse:collapse;
  margin-bottom:35px;
}

.infoTable th,
.infoTable td{
  padding:13px 14px;
  border-bottom:1px solid #e7ecf2;
  text-align:left;
  vertical-align:top;
  line-height:1.6;
}

.infoTable th{
  width:130px;
  background:#f7f9fb;
  color:#566378;
  font-size:13px;
}

.infoTable td{
  color:#26334a;
  white-space:pre-wrap;
  word-break:break-word;
}

.wikiSection{
  margin-top:25px;
}

.wikiSection h3{
  padding-bottom:10px;
  border-bottom:2px solid #27354b;
  margin:0 0 15px;
  font-size:20px;
}

.wikiBody{
  color:#465268;
  line-height:1.85;
  white-space:pre-wrap;
  word-break:break-word;
}

.detailActions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  padding:0 55px 45px;
}

.detailActions button{
  border:0;
  border-radius:9px;
  padding:9px 13px;
  background:#edf2f7;
  color:#526078;
}

.detailActions .deleteBtn{
  background:#f8e2e2;
  color:#a84f4f;
}

/* =========================
   모바일
========================= */

@media(max-width:700px){

  .wrap{
    width:92%;
    padding:28px 0 60px;
  }

  .hero{
    padding:25px 0;
  }

  .hero h1{
    font-size:36px;
    letter-spacing:-1.5px;
  }

  .hero p{
    font-size:14px;
  }

  .toolbar{
    align-items:flex-start;
    flex-direction:column;
    padding:15px;
  }

  .grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:12px;
  }

  .cardbody{
    padding:11px;
  }

  .cardTitle{
    font-size:14px;
  }

  .cardFolder{
    font-size:11px;
  }

  .cardactions{
    flex-wrap:wrap;
  }

  .cardactions button{
    padding:6px 8px;
  }

  .formGrid{
    grid-template-columns:1fr;
  }

  .row.full{
    grid-column:auto;
  }

  .modal{
    max-height:94vh;
    padding:20px;
    border-radius:15px;
  }

  /* 상세창은 모바일에서 진짜 전체 화면 */
  .detailOverlay{
    align-items:stretch;
    justify-content:stretch;
  }

  .detailPage{
    width:100vw;
    height:100vh;
    min-height:100vh;
    border-radius:0;
  }

  .detailClose{
    top:12px;
    right:12px;
  }

  .detailHeader{
    padding:65px 22px 22px;
  }

  .detailHeader h2{
    font-size:28px;
  }

  .detailImageWrap{
    padding:25px 20px 10px;
  }

  .detailImage{
    max-width:100%;
    max-height:48vh;
  }

  .detailContent{
    padding:15px 20px 35px;
  }

  .infoTable th,
  .infoTable td{
    padding:10px 9px;
    font-size:13px;
  }

  .infoTable th{
    width:85px;
  }

  .detailActions{
    padding:0 20px 35px;
  }

  .adminPanel{
    width:82vw;
    min-width:0;
  }
}

@media(max-width:420px){

  .grid{
    grid-template-columns:1fr 1fr;
  }

  .hero h1{
    font-size:31px;
  }

  .infoTable th{
    width:75px;
  }
}
</style>
</head>

<body>

<!-- =========================
     비밀번호 화면
========================= -->

<div id="lockScreen">

  <div class="lockBox">

    <h1>이펙필드 아카데미</h1>

    <p>
      아카이브에 입장하려면<br>
      비밀번호를 입력해주세요.
    </p>

    <input
      id="sitePassword"
      class="lockInput"
      type="password"
      placeholder="비밀번호"
      autocomplete="off"
    >

    <button class="primaryBtn" onclick="unlock()">
      입장하기
    </button>

    <div id="lockError" class="errorText"></div>

  </div>

</div>


<!-- =========================
     관리자 버튼
========================= -->

<button
  id="adminToggle"
  class="adminToggle"
  onclick="toggleAdminPanel()"
  aria-label="관리자 패널"
>
  &gt;
</button>


<!-- =========================
     관리자 패널
========================= -->

<aside id="adminPanel" class="adminPanel">

  <h2>관리자 패널</h2>

  <p>
    관리자 비밀번호를 입력하면<br>
    자료와 폴더를 추가하거나 수정할 수 있습니다.
  </p>

  <div class="adminStatus">
    현재 상태 :
    <strong id="adminStatusText">일반 이용자</strong>
  </div>

  <input
    id="adminPassword"
    class="adminInput"
    type="password"
    placeholder="관리자 비밀번호"
    autocomplete="off"
  >

  <div class="adminButtons">

    <button
      class="adminLogin"
      onclick="unlockAdmin()"
    >
      관리자 로그인
    </button>

    <button
      class="adminLogout"
      onclick="disableAdmin()"
    >
      로그아웃
    </button>

    <button onclick="closeAdminPanel()">
      닫기
    </button>

  </div>

  <div id="adminError" class="errorText"></div>

</aside>


<!-- =========================
     메인
========================= -->

<main>

  <div class="wrap">

    <div class="brand">
      이펙필드 아카데미
    </div>

    <section class="hero">

      <h1>이펙필드 아카데미</h1>

      <p>
        초능력을 올바른 곳에 사용하는 것을 목적으로 하는
        다양한 분야의 아카데미
      </p>

    </section>


    <div class="toolbar">

      <div>
        <h2 id="folderTitle">
          전체 자료
        </h2>

        <div
          id="breadcrumb"
          class="breadcrumb"
        >
          전체 자료
        </div>
      </div>

    </div>


    <!-- 관리자일 때만 보임 -->

    <section
      id="createPanel"
      class="createPanel"
    >

      <h2>자료 관리</h2>

      <div class="createButtons">

        <button
          class="mainCreate"
          onclick="openFolderModal()"
        >
          + 폴더 만들기
        </button>

        <button
          class="mainCreate"
          onclick="openItemModal()"
        >
          + 자료 추가
        </button>

      </div>

    </section>


    <section
      id="grid"
      class="grid"
    ></section>

  </div>

</main>


<!-- =========================
     폴더 / 자료 입력 모달
========================= -->

<div
  id="modalBg"
  class="modalBg"
  onclick="backgroundCloseModal(event)"
>

  <div
    class="modal"
    onclick="event.stopPropagation()"
  >

    <h3 id="modalTitle">
      자료 추가
    </h3>

    <div id="modalContent"></div>

    <div class="modalfoot">

      <button
        class="cancelBtn"
        onclick="closeModal()"
      >
        취소
      </button>

      <button
        class="saveBtn"
        onclick="saveModal()"
      >
        저장
      </button>

    </div>

  </div>

</div>


<!-- =========================
     상세 정보 오버레이
========================= -->

<div
  id="detailOverlay"
  class="detailOverlay"
>

  <button
    class="detailClose"
    onclick="closeDetail()"
    aria-label="닫기"
  >
    ×
  </button>

  <article
    id="detailPage"
    class="detailPage"
  ></article>

</div>


<script>
/* =========================================================
   기본 설정
========================================================= */

const SITE_PASSWORD = "1234";
const ADMIN_PASSWORD = "Leeafnatureminna0103399";
const STORAGE_KEY = "effectFieldAcademy_v5";

let data;
let currentFolderId = "root";
let editingId = null;
let editingType = null;
let adminMode = false;


/* =========================================================
   ID 생성
========================================================= */

function uid(){
  if(
    typeof crypto !== "undefined" &&
    crypto.randomUUID
  ){
    return crypto.randomUUID();
  }

  return (
    Date.now().toString(36) +
    Math.random().toString(36).slice(2)
  );
}


/* =========================================================
   데이터 불러오기
========================================================= */

function loadData(){

  try{

    const saved =
      localStorage.getItem(STORAGE_KEY);

    if(saved){
      data = JSON.parse(saved);
    }

  }catch(error){

    console.error(error);

  }

  if(
    !data ||
    !Array.isArray(data.folders) ||
    !Array.isArray(data.items)
  ){

    data = {

      folders:[
        {
          id:"root",
          name:"전체 자료",
          parent:null
        }
      ],

      items:[]

    };

  }

  const rootExists =
    data.folders.some(
      folder => folder.id === "root"
    );

  if(!rootExists){

    data.folders.unshift({
      id:"root",
      name:"전체 자료",
      parent:null
    });

  }

}


function saveData(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(data)
  );

}


/* =========================================================
   HTML 안전 처리
========================================================= */

function escapeHTML(value){

  if(value === null || value === undefined){
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

========================================================= */

function unlock(){

  const input =
    document.getElementById("sitePassword");

/* =========================================================
   폴더 관련
========================================================= */

function getCurrentFolder(){

  return data.folders.find(
    folder => folder.id === currentFolderId
  ) || data.folders[0];

}


function getFolderPath(folderId){

  const path = [];

  let folder =
    data.folders.find(
      f => f.id === folderId
    );

  while(folder){

    path.unshift(folder);

    if(!folder.parent){
      break;
    }

    folder =
      data.folders.find(
        f => f.id === folder.parent
      );

  }

  return path;

}


function getChildFolders(parentId){

  return data.folders.filter(
    folder =>
      folder.parent === parentId &&
      folder.id !== "root"
  );

}


function goHome(){

  currentFolderId = "root";
  render();

}


function openFolder(id){

  currentFolderId = id;
  render();

}


/* =========================================================
   화면 렌더링
========================================================= */

function render(){

  const grid =
    document.getElementById("grid");

  const title =
    document.getElementById("folderTitle");

  const breadcrumb =
    document.getElementById("breadcrumb");

  const current =
    getCurrentFolder();

  title.textContent =
    current.name;

  const path =
    getFolderPath(current.id);

  breadcrumb.innerHTML =
    path.map(
      (folder,index) => {

        if(index === path.length - 1){
          return escapeHTML(folder.name);
        }

        return `
          <span
            style="cursor:pointer"
            onclick="openFolder('${folder.id}')"
          >
            ${escapeHTML(folder.name)}
          </span>
          <span> / </span>
        `;

      }
    ).join("");

  grid.innerHTML = "";

  const folders =
    getChildFolders(currentFolderId);

  const items =
    data.items.filter(
      item => item.folder === currentFolderId
    );

  if(
    folders.length === 0 &&
    items.length === 0
  ){

    grid.innerHTML = `
      <div class="empty">
        이 폴더에는 아직 자료가 없습니다.
        ${
          adminMode
            ? "<br>관리자 모드에서 자료를 추가해보세요."
            : ""
        }
      </div>
    `;

    return;

  }


  folders.forEach(addFolderCard);
  items.forEach(addItemCard);

}

/* =========================================================
   폴더 생성
========================================================= */

function openFolderModal(){

  if(!adminMode){
    alert("관리자 모드가 필요합니다.");
    return;
  }

  editingId = null;
  editingType = "folder";

  document.getElementById(
    "modalTitle"
  ).textContent = "폴더 만들기";

  document.getElementById(
    "modalContent"
  ).innerHTML = `

    <div class="row">

      <label>폴더 이름</label>

      <input
        id="folderName"
        type="text"
        placeholder="예: 학생 자료"
      >

    </div>

  `;

  document
    .getElementById("modalBg")
    .classList.add("show");

}


function editFolder(id){

  if(!adminMode){
    return;
  }

  const folder =
    data.folders.find(
      f => f.id === id
    );

  if(!folder){
    return;
  }

  editingId = id;
  editingType = "folder";

  document.getElementById(
    "modalTitle"
  ).textContent = "폴더 수정";

  document.getElementById(
    "modalContent"
  ).innerHTML = `

    <div class="row">

      <label>폴더 이름</label>

      <input
        id="folderName"
        type="text"
        value="${escapeHTML(folder.name)}"
      >

    </div>

  `;

  document
    .getElementById("modalBg")
    .classList.add("show");

}


function saveFolder(){

  const input =
    document.getElementById("folderName");

  const name =
    input.value.trim();

  if(!name){

    alert("폴더 이름을 입력해주세요.");
    return;

  }

  if(editingId){

    const folder =
      data.folders.find(
        f => f.id === editingId
      );

    if(folder){
      folder.name = name;
    }

  }else{

    data.folders.push({

      id:uid(),
      name:name,
      parent:currentFolderId

    });

  }

  saveData();
  closeModal();
  render();

}


function deleteFolder(id){

  if(!adminMode){
    return;
  }

  if(id === "root"){
    return;
  }

  const folder =
    data.folders.find(
      f => f.id === id
    );

  if(!folder){
    return;
  }

  const children =
    data.folders.filter(
      f => f.parent === id
    );

  const items =
    data.items.filter(
      item => item.folder === id
    );

  if(
    children.length > 0 ||
    items.length > 0
  ){

    alert(
      "폴더 안에 자료나 하위 폴더가 있어 삭제할 수 없습니다."
    );

    return;

  }

  if(
    !confirm(
      `"${folder.name}" 폴더를 삭제할까요?`
    )
  ){
    return;
  }

  data.folders =
    data.folders.filter(
      f => f.id !== id
    );

  saveData();
  render();

}

      <div class="row full">

        <label>가족관계</label>

      </div>

function previewUpload(event){

  const file =
    event.target.files[0];

  if(!file){
    return;
  }

  const reader =
    new FileReader();

  reader.onload = function(e){

    const preview =
      document.getElementById(
        "imagePreview"
      );

    preview.src =
      e.target.result;

    preview.style.display =
      "block";

  };

  reader.readAsDataURL(file);

}


function saveItem(){

  const title =
    document.getElementById(
      "itemTitle"
    ).value.trim();

  if(!title){

    alert("자료 제목을 입력해주세요.");
    return;

  }

  const oldItem =
    editingId
      ? data.items.find(
          item => item.id === editingId
        )
      : null;

  const preview =
    document.getElementById(
      "imagePreview"
    );

  const image =
    preview && preview.src
      ? preview.src
      : (oldItem?.image || "");

  const item = {

    id:
      editingId ||
      uid(),

    title:title,

    body:
      document.getElementById(
        "itemBody"
      ).value,

    folder:
      document.getElementById(
        "itemFolder"
      ).value,

    image:image,

    fields:{

      name:
        document.getElementById(
          "fieldName"
        ).value,

      grade:
        document.getElementById(
          "fieldGrade"
        ).value,

      summary:
        document.getElementById(
          "fieldSummary"
        ).value,

      field:
        document.getElementById(
          "fieldField"
        ).value,

      power:
        document.getElementById(
          "fieldPower"
        ).value,

      like:
        document.getElementById(
          "fieldLike"
        ).value,

      dislike:
        document.getElementById(
          "fieldDislike"
        ).value,

      family:
        document.getElementById(
          "fieldFamily"
        ).value,

      relation:
        document.getElementById(
          "fieldRelation"
        ).value

    }

  };


  if(editingId){

    const index =
      data.items.findIndex(
        i => i.id === editingId
      );

    if(index !== -1){
      data.items[index] = item;
    }

  }else{

    data.items.push(item);

  }

  saveData();
  closeModal();
  render();

}


/* =========================================================
   자료 삭제
========================================================= */

function deleteItem(id){

  if(!adminMode){
    return;
  }

  const item =
    data.items.find(
      i => i.id === id
    );

  if(!item){
    return;
  }

  if(
    !confirm(
      `"${item.title}" 자료를 삭제할까요?`
    )
  ){
    return;
  }

  data.items =
    data.items.filter(
      i => i.id !== id
    );

  saveData();
  render();

}


/* =========================================================
   모달 공통
========================================================= */

function saveModal(){

  if(editingType === "folder"){
    saveFolder();
    return;
  }

  if(editingType === "item"){
    saveItem();
    return;
  }

}


function closeModal(){

  document
    .getElementById("modalBg")
    .classList.remove("show");

  editingId = null;
  editingType = null;

}


function backgroundCloseModal(event){

  if(
    event.target.id === "modalBg"
  ){
    closeModal();
  }

}

/* =========================================================
   키보드
========================================================= */

document
  .getElementById("sitePassword")
  .addEventListener(
    "keydown",
    function(event){

      if(event.key === "Enter"){
        unlock();
      }

    }
  );


document
  .getElementById("adminPassword")
  .addEventListener(
    "keydown",
    function(event){

      if(event.key === "Enter"){
        unlockAdmin();
      }

    }
  );


document.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Escape"){

      const detail =
        document.getElementById(
          "detailOverlay"
        );

      const modal =
        document.getElementById(
          "modalBg"
        );

      if(detail.classList.contains("show")){
        closeDetail();
      }

      if(modal.classList.contains("show")){
        closeModal();
      }

    }

  }
);

   상세 오버레이 바깥 클릭
========================================================= */

document
  .getElementById("detailOverlay")
  .addEventListener(
    "click",
    function(event){

      if(
        event.target === this
      ){
        closeDetail();
      }

    }
  );


/* =========================================================
   시작
========================================================= */

loadData();

if(
  sessionStorage.getItem(
    "effectFieldUnlocked"
  ) === "yes"
){

  document.getElementById(
    "lockScreen"
  ).style.display = "none";

}

render();

</script>
