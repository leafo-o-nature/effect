<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Effect Field Academy</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Pretendard", "Noto Sans KR", Arial, sans-serif;
      color: #35444a;

      background:
        linear-gradient(
          135deg,
          #9cd098,
          #94d3e1,
          #9fb6fc,
          #9cd098
        );

      background-size: 300% 300%;
      animation: backgroundMove 15s ease infinite;
    }

    @keyframes backgroundMove {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: min(1150px, calc(100% - 30px));
      margin: auto;
      padding: 45px 0 70px;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      text-align: center;
      color: white;
      margin-bottom: 35px;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.12);
    }

    header h1 {
      margin: 0;
      font-size: clamp(35px, 6vw, 60px);
      font-weight: 800;
      letter-spacing: -2px;
    }

    header p {
      margin: 10px 0 0;
      font-size: 15px;
      opacity: 0.9;
    }

    /* =========================
       PANEL
    ========================= */

    .panel {
      padding: 30px;
      border-radius: 28px;

      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      border: 1px solid rgba(255, 255, 255, 0.7);

      box-shadow:
        0 20px 60px rgba(54, 90, 120, 0.14),
        inset 0 1px 0 rgba(255, 255, 255, 0.8);
    }

    .section-title {
      margin: 0 0 22px;
      color: #40545c;
      font-size: 21px;
      font-weight: 800;
    }

    /* =========================
       IMAGE
    ========================= */

    .image-area {
      display: grid;
      grid-template-columns: 180px 1fr;
      gap: 24px;
      align-items: center;
      margin-bottom: 30px;
    }

    .preview {
      width: 180px;
      height: 180px;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      border-radius: 24px;

      background:
        linear-gradient(
          135deg,
          #dff1e5,
          #d9eef4,
          #e4e8ff
        );

      color: #7c9299;
      font-size: 13px;

      border: 1px solid rgba(255, 255, 255, 0.9);
    }

    .preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .image-info p {
      margin: 0 0 14px;
      color: #64767d;
      font-size: 14px;
      line-height: 1.6;
    }

    .file-input {
      display: none;
    }

    .upload-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      padding: 11px 17px;

      border-radius: 12px;

      background: #edf7f7;
      border: 1px solid #d6e8ea;

      color: #46666d;
      font-weight: 700;
    }

    /* =========================
       FORM
    ========================= */

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .field label {
      display: block;
      margin-bottom: 8px;

      color: #5a6c73;
      font-size: 13px;
      font-weight: 700;
    }

    .field input,
    .field textarea {
      width: 100%;

      padding: 13px 15px;

      border: 1px solid #dbe5e8;
      border-radius: 14px;

      outline: none;

      background: rgba(255, 255, 255, 0.8);
      color: #263238;

      transition: 0.2s;
    }

    .field textarea {
      min-height: 110px;
      resize: vertical;
    }

    .field input:focus,
    .field textarea:focus {
      border-color: #94cfd5;

      box-shadow:
        0 0 0 4px rgba(148, 211, 225, 0.18);

      background: white;
    }

    /* =========================
       BUTTONS
    ========================= */

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 28px;
    }

    .btn {
      padding: 12px 19px;

      border: none;
      border-radius: 13px;

      font-weight: 750;

      transition:
        transform 0.15s,
        box-shadow 0.15s;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn-primary {
      background:
        linear-gradient(
          135deg,
          #8bcf9d,
          #8ccbd9
        );

      color: white;

      box-shadow:
        0 7px 20px rgba(110, 177, 181, 0.22);
    }

    .btn-secondary {
      background: #edf3f5;
      color: #52676e;
    }

    /* =========================
       SAVED CHARACTERS
    ========================= */

    .saved-section {
      margin-top: 30px;
    }

    .saved-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 18px;
    }

    .saved-header h2 {
      margin: 0;
      color: #40545c;
      font-size: 21px;
    }

    .refresh-btn {
      padding: 9px 13px;

      border: none;
      border-radius: 10px;

      background: rgba(255, 255, 255, 0.65);
      color: #60747a;

      font-weight: 700;
    }

    .saved-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 15px;
    }

    .saved-card {
      display: flex;
      align-items: center;
      gap: 14px;

      padding: 15px;

      border-radius: 20px;

      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.85);
    }

    .saved-thumb {
      width: 75px;
      height: 75px;

      flex-shrink: 0;

      overflow: hidden;

      border-radius: 15px;

      background: #e6eff1;
    }

    .saved-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .saved-info {
      min-width: 0;
      flex: 1;
    }

    .saved-info h3 {
      margin: 0 0 5px;

      font-size: 16px;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .saved-info p {
      margin: 0;

      color: #718188;
      font-size: 12px;
    }

    .saved-buttons {
      display: flex;
      gap: 6px;
      margin-top: 9px;
    }

    .small-btn {
      padding: 7px 9px;

      border: none;
      border-radius: 8px;

      background: #eef4f5;
      color: #587078;

      font-size: 11px;
      font-weight: 700;
    }

    .small-btn.delete {
      background: #f7ebed;
      color: #a1646d;
    }

    .empty {
      grid-column: 1 / -1;

      padding: 45px 20px;

      border-radius: 18px;

      background: rgba(255, 255, 255, 0.55);

      color: #789097;

      text-align: center;
    }

    /* =========================
       TOAST
    ========================= */

    .status {
      position: fixed;

      left: 50%;
      bottom: 25px;

      transform:
        translateX(-50%)
        translateY(20px);

      padding: 12px 18px;

      border-radius: 13px;

      background: rgba(45, 59, 64, 0.92);
      color: white;

      font-size: 13px;

      opacity: 0;
      pointer-events: none;

      transition: 0.25s;

      z-index: 1000;
      white-space: nowrap;
    }

    .status.show {
      opacity: 1;

      transform:
        translateX(-50%)
        translateY(0);
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

      .app {
        width: calc(100% - 20px);
        padding-top: 25px;
      }

      .panel {
        padding: 20px;
        border-radius: 22px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .image-area {
        grid-template-columns: 1fr;
      }

      .preview {
        width: 150px;
        height: 150px;
      }

      .saved-list {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- HEADER -->

  <header>
    <h1>Effect Field Academy</h1>
    <p>academy for using superpowers in the right place</p>
  </header>


  <!-- CHARACTER FORM -->

  <section class="panel">

    <h2 class="section-title">
      Character Information
    </h2>


    <!-- IMAGE -->

    <div class="image-area">

      <div
        class="preview"
        id="preview"
      >
        이미지 없음
      </div>

      <div class="image-info">

        <p>
          캐릭터의 대표 이미지를 등록할 수 있습니다.<br>
          선택한 이미지는 이 브라우저에만 저장됩니다.
        </p>

        <label
          class="upload-btn"
          for="imageInput"
        >
          이미지 선택
        </label>

        <input
          id="imageInput"
          class="file-input"
          type="file"
          accept="image/*"
        >

      </div>

    </div>


    <!-- INPUTS -->

    <div class="form-grid">

      <div class="field">

        <label for="name">
          이름
        </label>

        <input
          id="name"
          type="text"
          placeholder="캐릭터 이름"
        >

      </div>


      <div class="field">

        <label for="grade">
          학년
        </label>

        <input
          id="grade"
          type="text"
          placeholder="예: 2학년"
        >

      </div>


      <div class="field">

        <label for="field">
          Field
        </label>

        <input
          id="field"
          type="text"
          placeholder="능력 분야"
        >

      </div>


      <div class="field">

        <label for="ability">
          Ability
        </label>

        <input
          id="ability"
          type="text"
          placeholder="능력 이름"
        >

      </div>


      <div class="field">

        <label for="likes">
          Likes
        </label>

        <textarea
          id="likes"
          placeholder="좋아하는 것"
        ></textarea>

      </div>


      <div class="field">

        <label for="dislikes">
          Dislikes
        </label>

        <textarea
          id="dislikes"
          placeholder="싫어하는 것"
        ></textarea>

      </div>


      <div class="field">

        <label for="family">
          Family
        </label>

        <textarea
          id="family"
          placeholder="가족 관계"
        ></textarea>

      </div>


      <div class="field">

        <label for="relationships">
          Relationships
        </label>

        <textarea
          id="relationships"
          placeholder="인물 관계"
        ></textarea>

      </div>

    </div>


    <!-- ACTIONS -->

    <div class="actions">

      <button
        id="saveBtn"
        class="btn btn-primary"
        type="button"
      >
        저장하기
      </button>

      <button
        id="newBtn"
        class="btn btn-secondary"
        type="button"
      >
        새로 작성
      </button>

    </div>

  </section>


  <!-- SAVED CHARACTERS -->

  <section class="panel saved-section">

    <div class="saved-header">

      <h2>
        Saved Characters
      </h2>

      <button
        id="refreshBtn"
        class="refresh-btn"
        type="button"
      >
        새로고침
      </button>

    </div>


    <div
      id="savedList"
      class="saved-list"
    ></div>

  </section>

</div>


<!-- STATUS -->

<div
  id="status"
  class="status"
></div>


<script>

  /* =====================================================
     LOCAL STORAGE
     ===================================================== */

  const STORAGE_KEY =
    "effect-field-academy-characters";


  let characters =
    JSON.parse(
      localStorage.getItem(STORAGE_KEY) || "[]"
    );


  let editingId = null;

  let selectedImage = "";


  /* =====================================================
     DOM
     ===================================================== */

  const imageInput =
    document.getElementById("imageInput");

  const preview =
    document.getElementById("preview");

  const saveBtn =
    document.getElementById("saveBtn");

  const newBtn =
    document.getElementById("newBtn");

  const refreshBtn =
    document.getElementById("refreshBtn");

  const savedList =
    document.getElementById("savedList");

  const status =
    document.getElementById("status");


  /* =====================================================
     STATUS MESSAGE
     ===================================================== */

  function showStatus(message) {

    status.textContent = message;

    status.classList.add("show");

    setTimeout(() => {

      status.classList.remove("show");

    }, 2500);

  }


  /* =====================================================
     SAVE LOCAL STORAGE
     ===================================================== */

  function saveCharacters() {

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(characters)
    );

  }


  /* =====================================================
     GET FORM DATA
     ===================================================== */

  function getFormData() {

    return {

      name:
        document.getElementById("name").value.trim(),

      grade:
        document.getElementById("grade").value.trim(),

      field:
        document.getElementById("field").value.trim(),

      ability:
        document.getElementById("ability").value.trim(),

      likes:
        document.getElementById("likes").value.trim(),

      dislikes:
        document.getElementById("dislikes").value.trim(),

      family:
        document.getElementById("family").value.trim(),

      relationships:
        document
          .getElementById("relationships")
          .value
          .trim(),

      image:
        selectedImage

    };

  }


  /* =====================================================
     SET FORM DATA
     ===================================================== */

  function setFormData(data) {

    document.getElementById("name").value =
      data.name || "";

    document.getElementById("grade").value =
      data.grade || "";

    document.getElementById("field").value =
      data.field || "";

    document.getElementById("ability").value =
      data.ability || "";

    document.getElementById("likes").value =
      data.likes || "";

    document.getElementById("dislikes").value =
      data.dislikes || "";

    document.getElementById("family").value =
      data.family || "";

    document.getElementById("relationships").value =
      data.relationships || "";

    selectedImage =
      data.image || "";

    updatePreview();

  }


  /* =====================================================
     IMAGE
  ===================================================== */

  imageInput.addEventListener(
    "change",
    function(event) {

      const file =
        event.target.files[0];

      if (!file) {
        return;
      }


      const reader =
        new FileReader();


      reader.onload =
        function(e) {

          selectedImage =
            e.target.result;

          updatePreview();

        };


      reader.readAsDataURL(file);

    }
  );


  function updatePreview() {

    if (!selectedImage) {

      preview.innerHTML =
        "이미지 없음";

      return;
    }


    preview.innerHTML = `
      <img
        src="${selectedImage}"
        alt="캐릭터 이미지"
      >
    `;

  }


  /* =====================================================
     CLEAR FORM
  ===================================================== */

  function clearForm() {

    editingId = null;

    selectedImage = "";

    document.getElementById("name").value = "";
    document.getElementById("grade").value = "";
    document.getElementById("field").value = "";
    document.getElementById("ability").value = "";
    document.getElementById("likes").value = "";
    document.getElementById("dislikes").value = "";
    document.getElementById("family").value = "";
    document.getElementById("relationships").value = "";

    imageInput.value = "";

    updatePreview();

    saveBtn.textContent =
      "저장하기";

  }


  /* =====================================================
     SAVE
  ===================================================== */

  saveBtn.addEventListener(
    "click",
    function() {

      const data =
        getFormData();


      if (!data.name) {

        showStatus(
          "이름을 입력해주세요."
        );

        document
          .getElementById("name")
          .focus();

        return;
      }


      /* 수정 */

      if (editingId !== null) {

        const index =
          characters.findIndex(
            character =>
              character.id === editingId
          );


        if (index !== -1) {

          characters[index] = {

            ...characters[index],

            ...data

          };

        }


        showStatus(
          "캐릭터가 수정되었습니다."
        );

      }


      /* 새 캐릭터 */

      else {

        characters.unshift({

          id:
            Date.now(),

          ...data,

          createdAt:
            new Date().toISOString()

        });


        showStatus(
          "캐릭터가 저장되었습니다."
        );

      }


      saveCharacters();

      renderCharacters();

      clearForm();

    }
  );


  /* =====================================================
     NEW
  ===================================================== */

  newBtn.addEventListener(
    "click",
    function() {

      clearForm();

      showStatus(
        "새 캐릭터를 작성할 수 있습니다."
      );

    }
  );


  /* =====================================================
     REFRESH
  ===================================================== */

  refreshBtn.addEventListener(
    "click",
    function() {

      characters =
        JSON.parse(
          localStorage.getItem(
            STORAGE_KEY
          ) || "[]"
        );

      renderCharacters();

      showStatus(
        "목록을 새로고침했습니다."
      );

    }
  );


  /* =====================================================
     EDIT
  ===================================================== */

  function editCharacter(id) {

    const character =
      characters.find(
        item => item.id === id
      );


    if (!character) {
      return;
    }


    editingId = id;

    setFormData(character);

    saveBtn.textContent =
      "수정 저장";


    window.scrollTo({

      top: 0,

      behavior: "smooth"

    });

  }


  /* =====================================================
     DELETE
  ===================================================== */

  function deleteCharacter(id) {

    const character =
      characters.find(
        item => item.id === id
      );


    if (!character) {
      return;
    }


    const confirmed =
      confirm(
        `"${character.name || "이 캐릭터"}"를 삭제할까요?`
      );


    if (!confirmed) {
      return;
    }


    characters =
      characters.filter(
        item => item.id !== id
      );


    saveCharacters();

    renderCharacters();


    if (editingId === id) {

      clearForm();

    }


    showStatus(
      "캐릭터가 삭제되었습니다."
    );

  }


  /* =====================================================
     RENDER
  ===================================================== */

  function renderCharacters() {

    if (
      !characters ||
      characters.length === 0
    ) {

      savedList.innerHTML = `
        <div class="empty">
          저장된 캐릭터가 없습니다.
        </div>
      `;

      return;
    }


    savedList.innerHTML =
      characters
        .map(character => {

          const image =
            character.image
              ? `
                <img
                  src="${character.image}"
                  alt="${escapeHtml(character.name)}"
                >
              `
              : "";


          return `

            <div class="saved-card">

              <div class="saved-thumb">
                ${image}
              </div>


              <div class="saved-info">

                <h3>
                  ${escapeHtml(
                    character.name ||
                    "이름 없음"
                  )}
                </h3>

                <p>
                  ${escapeHtml(
                    character.field ||
                    "Field 미입력"
                  )}
                  ·
                  ${escapeHtml(
                    character.ability ||
                    "Ability 미입력"
                  )}
                </p>


                <div class="saved-buttons">

                  <button
                    class="small-btn"
                    onclick="editCharacter(${character.id})"
                  >
                    수정
                  </button>

                  <button
                    class="small-btn delete"
                    onclick="deleteCharacter(${character.id})"
                  >
                    삭제
                  </button>

                </div>

              </div>

            </div>

          `;

        })
        .join("");

  }


  /* =====================================================
     HTML ESCAPE
  ===================================================== */

  function escapeHtml(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  /* =====================================================
     START
  ===================================================== */

  renderCharacters();

</script>

</body>
</html>
