<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>이펙필드 아카데미</title>


<style>

/* =========================================================
   기본 색상
========================================================= */

:root{
  --green:#9CD098;
  --cyan:#94D3E1;
  --blue:#9FB6FC;

  --text:#26334a;
  --sub:#718096;

  --border:#dce4ef;

  --gradient:
    linear-gradient(
      135deg,
      #9CD098 0%,
      #94D3E1 35%,
      #9FB6FC 65%,
      #94D3E1 85%,
      #9CD098 100%
    );

  --button-gradient:
    linear-gradient(
      90deg,
      #9CD098,
      #94D3E1,
      #9FB6FC
    );
}


/* =========================================================
   전체
========================================================= */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  min-height:100%;
}

body{
  font-family:
    Arial,
    "Noto Sans KR",
    sans-serif;

  color:var(--text);

  background:
    linear-gradient(
      135deg,
      rgba(156,208,152,.38),
      rgba(148,211,225,.38),
      rgba(159,182,252,.38),
      rgba(148,211,225,.38),
      rgba(156,208,152,.38)
    );

  background-attachment:fixed;
}

body.detailOpen{
  overflow:hidden;
}

button,
input,
textarea,
select{
  font:inherit;
}


/* =========================================================
   공통 버튼
========================================================= */

.gradientBtn{
  border:0;

  background:var(--button-gradient);

  color:white;

  font-weight:600;

  border-radius:10px;

  padding:10px 17px;

  cursor:pointer;

  box-shadow:
    0 4px 12px rgba(120,150,200,.16);

  transition:
    transform .15s ease,
    box-shadow .15s ease,
    filter .15s ease;
}

.gradientBtn:hover{
  transform:translateY(-2px);

  box-shadow:
    0 7px 17px rgba(120,150,200,.25);

  filter:saturate(1.05);
}

.gradientBtn:active{
  transform:translateY(0);
}


/* =========================================================
   처음 비밀번호 화면
========================================================= */

#lockScreen{
  position:fixed;

  inset:0;

  z-index:99999;

  display:flex;

  justify-content:center;
  align-items:center;

  padding:20px;

  background:
    linear-gradient(
      135deg,
      #9CD098 0%,
      #94D3E1 35%,
      #9FB6FC 65%,
      #94D3E1 85%,
      #9CD098 100%
    );
}

.lockBox{
  width:min(410px,90vw);

  padding:40px 34px;

  background:rgba(255,255,255,.96);

  border-radius:20px;

  box-shadow:
    0 18px 50px rgba(50,70,100,.18);

  text-align:center;
}

.lockBox h1{
  margin:0;

  color:#111827;

  font-size:28px;

  letter-spacing:-.5px;
}

.lockBox p{
  margin:12px 0 24px;

  color:var(--sub);

  font-size:14px;
}

.lockInput{
  width:100%;

  height:48px;

  padding:0 15px;

  border:1px solid var(--border);

  border-radius:10px;

  outline:none;

  text-align:center;

  background:#fff;

  transition:.2s;
}

.lockInput:focus{
  border-color:#9FB6FC;

  box-shadow:
    0 0 0 3px rgba(159,182,252,.16);
}

.lockButton{
  width:100%;

  height:48px;

  margin-top:12px;

  border:0;

  border-radius:10px;

  background:var(--button-gradient);

  color:white;

  font-weight:600;

  cursor:pointer;

  transition:.15s;
}

.lockButton:hover{
  transform:translateY(-2px);

  box-shadow:
    0 7px 18px rgba(120,150,200,.25);
}

.errorText{
  min-height:20px;

  margin-top:12px;

  color:#ec6fa3;

  font-size:14px;
}


/* =========================================================
   메인 전체
========================================================= */

.mainPage{
  width:100%;

  min-height:100vh;

  padding:55px 0 80px;
}

.wrap{
  width:80%;

  max-width:1180px;

  margin:0 auto;
}


/* =========================================================
   상단 제목
========================================================= */

.hero{
  text-align:center;

  margin-bottom:35px;
}

.hero h1{
  margin:0;

  color:#111827;

  font-size:42px;

  font-weight:800;

  letter-spacing:-1.5px;
}

.hero p{
  margin:12px 0 0;

  color:#667085;

  font-size:15px;
}


/* =========================================================
   관리자 버튼
========================================================= */

.adminToggle{
  position:fixed;

  left:0;
  top:50%;

  transform:translateY(-50%);

  width:34px;
  height:68px;

  border:0;

  border-radius:0 12px 12px 0;

  background:var(--button-gradient);

  color:white;

  font-size:18px;

  cursor:pointer;

  z-index:5000;

  box-shadow:
    0 5px 18px rgba(80,100,140,.2);
}

.adminToggle:hover{
  width:39px;
}


/* =========================================================
   관리자 패널
========================================================= */

.adminPanel{
  position:fixed;

  left:-360px;
  top:0;

  width:20vw;

  min-width:260px;
  max-width:360px;

  height:100vh;

  padding:30px 23px;

  background:rgba(255,255,255,.98);

  box-shadow:
    8px 0 35px rgba(30,50,80,.15);

  z-index:4999;

  transition:left .25s ease;
}

.adminPanel.open{
  left:0;
}

.adminPanel h2{
  margin-top:0;

  color:#111827;
}

.adminPanel p{
  color:var(--sub);

  font-size:13px;

  line-height:1.6;
}

.adminPanel input{
  width:100%;

  height:44px;

  padding:0 12px;

  border:1px solid var(--border);

  border-radius:10px;

  outline:none;
}

.adminPanel button{
  width:100%;

  margin-top:10px;

  height:43px;

  border:0;

  border-radius:10px;

  background:var(--button-gradient);

  color:white;

  cursor:pointer;

  font-weight:600;
}

.adminStatus{
  margin-top:15px;

  padding:10px;

  border-radius:9px;

  background:#f5f7fb;

  color:var(--sub);

  font-size:13px;

  text-align:center;
}


/* =========================================================
   생성 패널
========================================================= */

.createPanel{
  display:none;

  margin-bottom:22px;

  padding:18px;

  background:rgba(255,255,255,.82);

  border:1px solid rgba(255,255,255,.8);

  border-radius:15px;

  box-shadow:
    0 5px 20px rgba(80,100,130,.07);
}

.createPanel.active{
  display:flex;

  gap:10px;
}


/* =========================================================
   툴바
========================================================= */

.toolbar{
  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:15px;

  margin-bottom:18px;
}

.homeButton{
  border:0;

  border-radius:10px;

  padding:9px 15px;

  background:white;

  color:#344054;

  cursor:pointer;

  box-shadow:
    0 3px 12px rgba(50,70,100,.07);
}

.homeButton:hover{
  background:#f9fafc;
}

.currentPath{
  color:#758195;

  font-size:14px;
}


/* =========================================================
   자료 영역
========================================================= */

.contentBox{
  background:rgba(255,255,255,.84);

  border:1px solid rgba(255,255,255,.9);

  border-radius:18px;

  padding:25px;

  box-shadow:
    0 10px 35px rgba(60,80,110,.08);
}

.grid{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:20px;
}


/* =========================================================
   카드
========================================================= */

.card{
  overflow:hidden;

  background:white;

  border:1px solid #e4e9f0;

  border-radius:14px;

  box-shadow:
    0 5px 18px rgba(50,70,100,.06);

  transition:
    transform .18s ease,
    box-shadow .18s ease;
}

.card:hover{
  transform:translateY(-3px);

  box-shadow:
    0 10px 25px rgba(50,70,100,.11);
}

.thumb{
  width:100%;

  aspect-ratio:1 / 1;

  background:#f1f4f8;

  cursor:pointer;

  overflow:hidden;
}

.thumb img{
  width:100%;
  height:100%;

  object-fit:cover;

  display:block;
}

.folderThumb{
  width:100%;
  height:100%;

  display:flex;

  align-items:center;
  justify-content:center;

  font-size:52px;

  background:
    linear-gradient(
      135deg,
      rgba(156,208,152,.18),
      rgba(148,211,225,.18),
      rgba(159,182,252,.18)
    );
}

.cardbody{
  padding:15px;
}

.cardbody h3{
  margin:0;

  color:#111827;

  font-size:17px;

  font-weight:700;
}

.cardbody p{
  margin:7px 0 0;

  color:#788397;

  font-size:13px;
}

.cardactions{
  display:flex;

  gap:7px;

  margin-top:12px;
}

.cardactions button{
  flex:1;

  border:0;

  border-radius:8px;

  padding:7px;

  background:var(--button-gradient);

  color:white;

  font-size:12px;

  cursor:pointer;
}


/* =========================================================
   모달
========================================================= */

.modalBg{
  display:none;

  position:fixed;

  inset:0;

  z-index:7000;

  padding:30px;

  background:rgba(25,35,55,.35);

  align-items:center;

  justify-content:center;
}

.modalBg.show{
  display:flex;
}

.modal{
  width:min(700px,90vw);

  max-height:88vh;

  overflow:auto;

  padding:28px;

  background:white;

  border-radius:18px;

  box-shadow:
    0 20px 60px rgba(20,30,50,.2);
}

.modal h2{
  margin-top:0;

  color:#111827;
}

.formGrid{
  display:grid;

  gap:15px;
}

.row label{
  display:block;

  margin-bottom:6px;

  color:#344054;

  font-size:13px;

  font-weight:700;
}

.row input,
.row textarea,
.row select{
  width:100%;

  padding:10px 12px;

  border:1px solid var(--border);

  border-radius:9px;

  outline:none;

  background:#fff;
}

.row input:focus,
.row textarea:focus,
.row select:focus{
  border-color:#9FB6FC;

  box-shadow:
    0 0 0 3px rgba(159,182,252,.12);
}

.row textarea{
  min-height:90px;

  resize:vertical;
}

.modalfoot{
  display:flex;

  justify-content:flex-end;

  gap:9px;

  margin-top:20px;
}

.modalfoot button{
  border:0;

  border-radius:9px;

  padding:10px 17px;

  background:var(--button-gradient);

  color:white;

  cursor:pointer;
}

.preview{
  display:block;

  max-width:180px;
  max-height:180px;

  margin-top:10px;

  border-radius:10px;

  object-fit:cover;
}


/* =========================================================
   상세 페이지
   처음 만들었던 나무위키식 창
========================================================= */

.detailOverlay{
  display:none;

  position:fixed;

  inset:0;

  z-index:8000;

  align-items:center;

  justify-content:center;

  padding:5vh 10vw;

  background:
    rgba(35,45,65,.34);
}

.detailOverlay.show{
  display:flex;
}

.detailPage{
  position:relative;

  width:80vw;

  height:90vh;

  overflow:auto;

  background:white;

  border-radius:18px;

  box-shadow:
    0 20px 70px rgba(20,30,50,.22);
}


/* 상세 상단 */

.detailHeader{
  padding:30px 38px 20px;

  border-bottom:1px solid #e7ebf1;
}

.detailHeader h2{
  margin:0;

  color:#111827;

  font-size:30px;

  letter-spacing:-.7px;
}

.detailHeader p{
  margin:8px 0 0;

  color:#788397;

  font-size:14px;
}


/* 상세 이미지 */

.detailImageWrap{
  padding:25px 38px 0;
}

.detailImage{
  display:block;

  width:100%;

  max-height:470px;

  object-fit:contain;

  background:#f5f7fa;

  border-radius:12px;
}


/* 상세 내용 */

.detailContent{
  padding:30px 38px 50px;
}


/* 나무위키식 표 */

.infoTable{
  width:100%;

  border-collapse:collapse;

  margin-bottom:30px;

  border-top:2px solid #dfe5ed;
}

.infoTable th,
.infoTable td{
  padding:12px 14px;

  border-bottom:1px solid #e4e8ee;

  text-align:left;

  vertical-align:top;

  line-height:1.6;
}

.infoTable th{
  width:145px;

  background:#f5f7fa;

  color:#4b5565;

  font-size:13px;

  font-weight:700;
}

.infoTable td{
  color:#354052;

  font-size:14px;

  white-space:pre-wrap;
}


/* 추가 설명 */

.wikiSection{
  margin-top:30px;
}

.wikiSection h3{
  margin:0;

  padding:11px 13px;

  color:#344054;

  background:#f4f6f9;

  border-left:4px solid #9FB6FC;

  font-size:17px;
}

.wikiBody{
  padding:17px 14px;

  color:#3f4a5b;

  line-height:1.8;

  white-space:pre-wrap;

  font-size:14px;
}


/* 상세 닫기 */

.detailClose{
  position:fixed;

  top:calc(5vh - 18px);

  right:calc(10vw - 18px);

  width:40px;
  height:40px;

  border:0;

  border-radius:50%;

  background:var(--button-gradient);

  color:white;

  font-size:21px;

  line-height:40px;

  cursor:pointer;

  z-index:9000;

  box-shadow:
    0 5px 18px rgba(50,70,100,.2);
}


/* 상세 관리자 버튼 */

.detailActions{
  display:flex;

  gap:8px;

  margin-top:30px;
}

.detailActions button{
  border:0;

  border-radius:9px;

  padding:9px 15px;

  background:var(--button-gradient);

  color:white;

  cursor:pointer;
}


/* =========================================================
   빈 자료
========================================================= */

.emptyState{
  grid-column:1/-1;

  padding:70px 20px;

  text-align:center;

  color:#8792a5;

  font-size:14px;
}


/* =========================================================
   모바일
========================================================= */

@media(max-width:700px){

  .mainPage{
    padding:35px 0 50px;
  }

  .wrap{
    width:92%;
  }

  .hero{
    margin-bottom:25px;
  }

  .hero h1{
    font-size:30px;
  }

  .hero p{
    font-size:13px;

    line-height:1.6;
  }

  .contentBox{
    padding:15px;

    border-radius:14px;
  }

  .grid{
    grid-template-columns:
      repeat(2,1fr);

    gap:12px;
  }

  .cardbody{
    padding:11px;
  }

  .cardbody h3{
    font-size:14px;
  }

  .cardbody p{
    font-size:12px;
  }

  .createPanel{
    flex-direction:column;
  }

  .createPanel button{
    width:100%;
  }

  .adminPanel{
    width:82vw;
  }

  /* 상세창 */

  .detailOverlay{
    padding:0;
  }

  .detailPage{
    width:100vw;

    height:100vh;

    border-radius:0;
  }

  .detailClose{
    top:13px;

    right:13px;
  }

  .detailHeader{
    padding:25px 20px 17px;

    padding-right:65px;
  }

  .detailHeader h2{
    font-size:24px;
  }

  .detailImageWrap{
    padding:18px 20px 0;
  }

  .detailContent{
    padding:22px 20px 40px;
  }

  .infoTable th{
    width:95px;
  }

  .infoTable th,
  .infoTable td{
    padding:10px;

    font-size:13px;
  }

  .modalBg{
    padding:15px;
  }

  .modal{
    width:100%;

    max-height:92vh;

    padding:22px;

    border-radius:16px;
  }
}

</style>
</head>


<body>


<!-- =========================================================
     비밀번호 화면
========================================================= -->

<div id="lockScreen">

  <div class="lockBox">

    <h1>이펙필드 아카데미</h1>

    <p>
      아카데미 자료를 확인하려면<br>
      비밀번호를 입력해주세요.
    </p>

    <input
      id="sitePassword"
      class="lockInput"
      type="password"
      placeholder="비밀번호"
      autocomplete="off"
      onkeydown="
        if(event.key === 'Enter'){
          unlock();
        }
      "
    >

    <button
      class="lockButton"
      onclick="unlock()"
    >
      입장하기
    </button>

    <div
      id="lockError"
      class="errorText"
    ></div>

  </div>

</div>


<!-- =========================================================
     관리자 버튼
========================================================= -->

<button
  class="adminToggle"
  onclick="toggleAdminPanel()"
>
  &gt;
</button>


<div
  id="adminPanel"
  class="adminPanel"
>

  <h2>관리자</h2>

  <p>
    관리자 비밀번호를 입력하면<br>
    자료를 추가하거나 수정할 수 있습니다.
  </p>

  <input
    id="adminPassword"
    type="password"
    placeholder="관리자 비밀번호"
  >

  <button onclick="unlockAdmin()">
    관리자 모드 켜기
  </button>

  <button onclick="disableAdmin()">
    관리자 모드 끄기
  </button>

  <div
    id="adminStatus"
    class="adminStatus"
  >
    일반 모드
  </div>

</div>


<!-- =========================================================
     메인
========================================================= -->

<div class="mainPage">

  <main class="wrap">

    <header class="hero">

      <h1>
        이펙필드 아카데미
      </h1>

      <p>
        초능력을 올바른 곳에 사용하는 것을 목적으로 하는 다양한 분야의 아카데미
      </p>

    </header>


    <!-- 관리자 생성 버튼 -->

    <section
      id="createPanel"
      class="createPanel"
    >

      <button
        class="gradientBtn"
        onclick="openFolderModal()"
      >
        + 폴더 만들기
      </button>

      <button
        class="gradientBtn"
        onclick="openItemModal()"
      >
        + 정보 만들기
      </button>

    </section>


    <!-- 자료 창 -->

    <section class="contentBox">

      <div class="toolbar">

        <button
          class="homeButton"
          onclick="goHome()"
        >
          🏠 전체 자료
        </button>

        <span
          id="currentPath"
          class="currentPath"
        ></span>

      </div>


      <section
        id="grid"
        class="grid"
      ></section>

    </section>

  </main>

</div>


<!-- =========================================================
     생성 / 수정 모달
========================================================= -->

<div
  id="modalBg"
  class="modalBg"
  onclick="
    if(event.target === this){
      closeModal();
    }
  "
>

  <div class="modal">

    <h2 id="modalTitle"></h2>

    <div id="modalContent"></div>

  </div>

</div>


<!-- =========================================================
     상세 페이지
========================================================= -->

<div
  id="detailOverlay"
  class="detailOverlay"
  onclick="
    if(event.target === this){
      closeDetail();
    }
  "
>

  <div
    id="detailPage"
    class="detailPage"
  ></div>


  <button
    class="detailClose"
    onclick="closeDetail()"
  >
    ×
  </button>

</div>


<script>

/* =========================================================
   기본 설정
========================================================= */


/*
  사이트 입장 비밀번호

  모든 사람이 사용하는 공용 비밀번호
*/

const SITE_PASSWORD = "1234";


/*
  관리자 비밀번호
*/

const ADMIN_PASSWORD =
  "Leeafnatureminna0103399";


/* =========================================================
   기본 데이터
========================================================= */

let data = {

  folders:[
    {
      id:"root",
      name:"전체 자료",
      parent:null
    }
  ],

  items:[]

};


let currentFolder = "root";

let adminMode = false;

let editingId = null;


/* =========================================================
   처음 비밀번호
========================================================= */

function unlock(){

  const input =
    document.getElementById(
      "sitePassword"
    );

  const error =
    document.getElementById(
      "lockError"
    );


  /*
    비밀번호가 맞을 경우
  */

  if(
    input.value === SITE_PASSWORD
  ){

    error.textContent = "";

    document
      .getElementById("lockScreen")
      .style.display = "none";


    /* 비밀번호는 저장하지 않습니다. */


    loadData();

    return;
  }


  /*
    비밀번호가 틀렸을 경우
  */

  error.textContent =
    "비밀번호가 맞지 않습니다";


  input.value = "";

  input.focus();

}


/* =========================================================
   처음 시작
========================================================= */

window.addEventListener(
  "DOMContentLoaded",
  function(){

    /*

/* =========================================================
   ID
========================================================= */

function uid(){

  return Date.now().toString(36)
    +
    Math.random()
      .toString(36)
      .slice(2);

}


/* =========================================================
   HTML escape
========================================================= */

function escapeHTML(value){

  if(
    value === undefined ||
    value === null
  ){

    return "";

  }


  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   데이터 불러오기
========================================================= */

function loadData(){

  try{

    const saved = localStorage.getItem("effectfield-academy-data");

    if(saved){
      const parsed = JSON.parse(saved);

      if(parsed && Array.isArray(parsed.folders) && Array.isArray(parsed.items)){
        data = parsed;
      }
    }

  }catch(error){
    console.error("저장된 데이터를 불러오지 못했습니다.", error);
  }

  render();

}


/* =========================================================
   데이터 저장
========================================================= */

function saveData(){

  try{

    localStorage.setItem(
      "effectfield-academy-data",
      JSON.stringify(data)
    );

    return true;

  }catch(error){

    console.error("데이터 저장 오류:", error);

    alert(
      "데이터를 저장하지 못했습니다.\n\n" +
      "브라우저 저장 공간이 부족하거나 저장이 차단되어 있을 수 있습니다."
    );

    return false;
  }

}


/* =========================================================
   폴더 관련
========================================================= */

function getCurrentFolder(){

  return data.folders.find(
    folder =>
      folder.id === currentFolder
  );

}


function getFolderPath(){

  const path = [];

  let folder =
    getCurrentFolder();


  while(folder){

    path.unshift(folder);

    folder =
      data.folders.find(
        f =>
          f.id === folder.parent
      );

  }


  return path;

}


function getChildFolders(parent){

  return data.folders.filter(
    folder =>
      folder.parent === parent
  );

}


function goHome(){

  currentFolder = "root";

  render();

}


function openFolder(id){

  currentFolder = id;

  render();

}


/* =========================================================
   화면 출력
========================================================= */

function render(){

  const grid =
    document.getElementById(
      "grid"
    );


  const path =
    document.getElementById(
      "currentPath"
    );


  const folders =
    getChildFolders(
      currentFolder
    );


  const items =
    data.items.filter(
      item =>
        item.folder === currentFolder
    );


  const folderPath =
    getFolderPath();


  path.textContent =
    folderPath
      .map(folder => folder.name)
      .join(" / ");


  grid.innerHTML = "";


  /* 폴더 */

  folders.forEach(folder => {

    const card =
      document.createElement(
        "article"
      );

    card.className = "card";


    card.innerHTML = `

      <div
        class="thumb"
        onclick="openFolder('${folder.id}')"
      >

        <div class="folderThumb">
          📁
        </div>

      </div>


      <div class="cardbody">

        <h3>
          ${escapeHTML(folder.name)}
        </h3>


        ${
          adminMode
          ?
          `
            <div class="cardactions">

              <button
                onclick="editFolder('${folder.id}')"
              >
                수정
              </button>

              <button
                onclick="deleteFolder('${folder.id}')"
              >
                삭제
              </button>

            </div>
          `
          :
          ""
        }

      </div>
    `;


    grid.appendChild(card);

  });


  /* 정보 */

  items.forEach(item => {

    const card =
      document.createElement(
        "article"
      );

    card.className = "card";


    const image =
      item.image
      ?
      `
        <img
          src="${item.image}"
          alt=""
        >
      `
      :
      `
        <div
          style="
            width:100%;
            height:100%;
            display:flex;
            align-items:center;
            justify-content:center;
            color:#9aa5b5;
            font-size:13px;
          "
        >
          이미지 없음
        </div>
      `;


    card.innerHTML = `

      <div
        class="thumb"
        onclick="showDetail('${item.id}')"
      >
        ${image}
      </div>


      <div class="cardbody">

        <h3>
          ${escapeHTML(item.name)}
        </h3>


        ${
          item.grade
          ?
          `
            <p>
              ${escapeHTML(item.grade)}
            </p>
          `
          :
          ""
        }


        ${
          adminMode
          ?
          `
            <div class="cardactions">

              <button
                onclick="editItem('${item.id}')"
              >
                수정
              </button>

              <button
                onclick="deleteItem('${item.id}')"
              >
                삭제
              </button>

            </div>
          `
          :
          ""
        }

      </div>
    `;


    grid.appendChild(card);

  });


  if(
    folders.length === 0 &&
    items.length === 0
  ){

    grid.innerHTML = `

      <div class="emptyState">

        아직 등록된 자료가 없습니다.

      </div>

    `;

  }

}

  editingId = id;

      f => f.id === id

    :
    null;


  document

          <label>
            폴더 이름

              escapeHTML(folder.name)

}


function editFolder(id){

  openFolderModal(id);

}


async function saveFolder(){

  const name =
    document
      .getElementById("folderName")
      .value
      .trim();


  if(!name){

    alert(
      "폴더 이름을 입력해주세요."
    );

    return;
  }


  if(editingId){

    const folder =
      data.folders.find(
        f => f.id === editingId
      );


    if(folder){

      folder.name = name;

    }

  }else{

    data.folders.push({

      id:uid(),

      name:name,

      parent:currentFolder

    });

  }


  closeModal();

  render();

  await saveData();

}


async function deleteFolder(id){

  if(id === "root"){

    alert(
      "전체 자료 폴더는 삭제할 수 없습니다."
    );

    return;
  }


  if(
    !confirm(
      "이 폴더를 삭제하시겠습니까?\n하위 자료도 함께 삭제됩니다."
    )
  ){

    return;
  }


  data.folders =
    data.folders.filter(
      folder =>
        folder.id !== id
    );


  data.items =
    data.items.filter(
      item =>
        item.folder !== id
    );


  render();

  await saveData();

}

  return data.folders

      return `

    .join("");

/* =========================================================
   이미지 미리보기
========================================================= */

function previewUpload(event){

  const file =
    event.target.files[0];


  if(!file){
    return;
  }


  const reader =
    new FileReader();


  reader.onload =
    function(e){

      document
        .getElementById("imagePreview")
        .innerHTML = `

          <img
            class="preview"
            src="${e.target.result}"
          >

        `;

    };


  reader.readAsDataURL(file);

}


/* =========================================================
   이미지 저장
========================================================= */

function uploadImage(file){

  return new Promise((resolve, reject) => {

    const reader = new FileReader();

    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error || new Error("이미지를 읽을 수 없습니다."));

    reader.readAsDataURL(file);

  });

}


/* =========================================================
   정보 저장
========================================================= */

async function saveItem(){

  const name =
    document
      .getElementById("itemName")
      .value
      .trim();


  if(!name){

    alert(
      "이름을 입력해주세요."
    );

    return;
  }


  let image = "";


  if(editingId){

    const oldItem =
      data.items.find(
        i => i.id === editingId
      );

    image =
      oldItem?.image || "";

  }


  const file =
    document
      .getElementById("itemImage")
      .files[0];


  if(file){

    try{

      image =
        await uploadImage(file);

    }catch(error){

      console.error(error);

      alert(
        "이미지를 불러오지 못했습니다.\n다시 시도해주세요."
      );

      return;
    }

  }


  const itemData = {

    name:name,

    grade:
      document
        .getElementById("itemGrade")
        .value,

    simple:
      document
        .getElementById("itemSimple")
        .value,

    field:
      document
        .getElementById("itemField")
        .value,

    ability:
      document
        .getElementById("itemAbility")
        .value,

    likes:
      document
        .getElementById("itemLikes")
        .value,

    dislikes:
      document
        .getElementById("itemDislikes")
        .value,

    family:
      document
        .getElementById("itemFamily")
        .value,

    relations:
      document
        .getElementById("itemRelations")
        .value,

    extra:
      document
        .getElementById("itemExtra")
        .value,

    image:image,

    folder:
      editingId
      ?
      (
        data.items.find(
          i => i.id === editingId
        )?.folder
        ||
        currentFolder
      )
      :
      currentFolder

  };


  if(editingId){

    const index =
      data.items.findIndex(
        i => i.id === editingId
      );


    if(index !== -1){

      data.items[index] = {

        ...data.items[index],

        ...itemData

      };

    }

  }else{

    data.items.push({

      id:uid(),

      ...itemData

    });

  }


  closeModal();

  render();

  await saveData();

}


/* =========================================================
   정보 삭제
========================================================= */

async function deleteItem(id){

    !confirm(
      "이 정보를 삭제하시겠습니까?"
    )
  ){

    return;
  }


  data.items =
    data.items.filter(
      item =>
        item.id !== id
    );


  render();

  await saveData();

}
