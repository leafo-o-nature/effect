<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이펙필드 아카데미</title>

<style>
:root{
  --green:#9CD098;
  --cyan:#94D3E1;
  --blue:#9FB6FC;
  --text:#26334a;
  --sub:#6b7890;
  --border:#dce4ef;
  --white:#ffffff;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  font-family:Arial,"Noto Sans KR",sans-serif;
  color:var(--text);
}

body{
  min-height:100vh;
  background:
    linear-gradient(
      135deg,
      rgba(156,208,152,.32),
      rgba(148,211,225,.32),
      rgba(159,182,252,.32),
      rgba(148,211,225,.32),
      rgba(156,208,152,.32)
    );
}

button,
input,
textarea,
select{
  font:inherit;
}

/* =========================
   비밀번호 화면
========================= */

#lockScreen{
  position:fixed;
  inset:0;
  z-index:99999;

  display:flex;
  justify-content:center;
  align-items:center;

  background:
    linear-gradient(
      135deg,
      #9CD098,
      #94D3E1,
      #9FB6FC,
      #94D3E1,
      #9CD098
    );
}

.lockBox{
  width:min(420px,88vw);
  padding:42px 34px;
  background:rgba(255,255,255,.94);
  border-radius:24px;
  text-align:center;
  box-shadow:0 20px 60px rgba(40,60,100,.15);
}

.lockBox h1{
  margin:0 0 10px;
  color:#111827;
  font-size:28px;
}

.lockBox p{
  margin:0 0 25px;
  color:var(--sub);
}

.lockInput{
  width:100%;
  height:48px;
  border:1px solid var(--border);
  border-radius:12px;
  padding:0 15px;
  outline:none;
  text-align:center;
}

.lockInput:focus{
  border-color:#9FB6FC;
}

.primaryBtn{
  width:100%;
  height:48px;
  margin-top:12px;
  border:0;
  border-radius:12px;
  cursor:pointer;
  color:#fff;
  background:linear-gradient(90deg,#9CD098,#94D3E1,#9FB6FC);
  font-weight:bold;
}

.errorText{
  min-height:22px;
  margin-top:12px;
  color:#ec6fa3;
  font-size:14px;
}

/* =========================
   전체
========================= */

.wrap{
  width:80%;
  max-width:1180px;
  margin:0 auto;
  padding:50px 0 80px;
}

.hero{
  text-align:center;
  margin-bottom:35px;
}

.hero h1{
  margin:0;
  color:#111827;
  font-size:42px;
}

.hero p{
  margin:12px 0 0;
  color:var(--sub);
}

/* =========================
   관리자 버튼
========================= */

.adminToggle{
  position:fixed;
  left:0;
  top:50%;
  transform:translateY(-50%);

  width:32px;
  height:70px;

  border:0;
  border-radius:0 14px 14px 0;
  background:#fff;
  box-shadow:0 5px 20px rgba(0,0,0,.1);

  cursor:pointer;
  z-index:5000;
}

.adminPanel{
  position:fixed;
  left:-360px;
  top:0;

  width:20vw;
  min-width:260px;
  max-width:360px;
  height:100vh;

  padding:30px 22px;
  background:#fff;

  box-shadow:10px 0 30px rgba(0,0,0,.12);
  z-index:4999;

  transition:.25s;
}

.adminPanel.open{
  left:0;
}

.adminPanel h2{
  color:#111827;
}

.adminPanel input{
  width:100%;
  height:44px;
  border:1px solid var(--border);
  border-radius:10px;
  padding:0 12px;
}

.adminPanel button{
  width:100%;
  height:44px;
  margin-top:10px;
  border:0;
  border-radius:10px;
  cursor:pointer;
  background:#eef3ff;
}

.adminStatus{
  margin-top:15px;
  font-size:14px;
  color:var(--sub);
}

/* =========================
   생성 영역
========================= */

.createPanel{
  display:none;
  margin-bottom:30px;
  padding:20px;
  background:rgba(255,255,255,.8);
  border:1px solid var(--border);
  border-radius:18px;
}

.createPanel.active{
  display:block;
}

.createPanel button{
  padding:10px 15px;
  margin-right:8px;
  border:0;
  border-radius:10px;
  cursor:pointer;
}

/* =========================
   툴바
========================= */

.toolbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:20px;
}

.toolbar button{
  border:0;
  border-radius:10px;
  padding:10px 15px;
  background:#fff;
  cursor:pointer;
}

/* =========================
   카드
========================= */

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:22px;
}

.card{
  overflow:hidden;
  background:#fff;
  border-radius:18px;
  border:1px solid var(--border);
  box-shadow:0 8px 25px rgba(50,70,100,.07);
}

.thumb{
  width:100%;
  aspect-ratio:1/1;
  background:#eef2f7;
  cursor:pointer;
}

.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.cardbody{
  padding:15px;
}

.cardbody h3{
  margin:0;
  color:#111827;
}

.cardbody p{
  color:var(--sub);
  font-size:14px;
}

.cardactions{
  display:flex;
  gap:7px;
  margin-top:10px;
}

.cardactions button{
  flex:1;
  padding:8px;
  border:0;
  border-radius:8px;
  cursor:pointer;
}

/* =========================
   모달
========================= */

.modalBg{
  display:none;

  position:fixed;
  inset:0;
  z-index:7000;

  background:rgba(20,30,50,.35);

  align-items:center;
  justify-content:center;
}

.modalBg.show{
  display:flex;
}

.modal{
  width:min(700px,92vw);
  max-height:90vh;
  overflow:auto;

  padding:25px;

  background:#fff;
  border-radius:20px;
}

.modal h2{
  color:#111827;
}

.formGrid{
  display:grid;
  gap:15px;
}

.row label{
  display:block;
  margin-bottom:6px;
  font-size:14px;
  font-weight:bold;
}

.row input,
.row textarea,
.row select{
  width:100%;
  padding:10px;
  border:1px solid var(--border);
  border-radius:10px;
}

.row textarea{
  min-height:90px;
  resize:vertical;
}

.modalfoot{
  display:flex;
  gap:10px;
  margin-top:20px;
}

.modalfoot button{
  flex:1;
  padding:12px;
  border:0;
  border-radius:10px;
  cursor:pointer;
}

.preview{
  max-width:180px;
  max-height:180px;
  margin-top:10px;
  border-radius:10px;
}

/* =========================
   상세 페이지
========================= */

.detailOverlay{
  display:none;

  position:fixed;
  inset:0;
  z-index:8000;

  background:rgba(20,30,50,.45);

  align-items:center;
  justify-content:center;
}

.detailOverlay.show{
  display:flex;
}

.detailPage{
  position:relative;

  width:80vw;
  height:90vh;

  overflow:auto;

  background:#fff;
  border-radius:22px;

  box-shadow:0 20px 70px rgba(0,0,0,.2);
}

.detailClose{
  position:fixed;
  top:25px;
  right:30px;

  width:42px;
  height:42px;

  border:0;
  border-radius:50%;

  background:#fff;
  box-shadow:0 5px 20px rgba(0,0,0,.15);

  cursor:pointer;
  z-index:9000;

  font-size:20px;
}

.detailHeader{
  padding:35px 40px 20px;
}

.detailHeader h2{
  margin:0;
  color:#111827;
  font-size:32px;
}

.detailHeader p{
  color:var(--sub);
}

.detailImageWrap{
  width:100%;
  padding:0 40px;
}

.detailImage{
  width:100%;
  max-height:480px;
  object-fit:contain;
  border-radius:15px;
  background:#f2f4f8;
}

.detailContent{
  padding:30px 40px 50px;
}

.infoTable{
  width:100%;
  border-collapse:collapse;
  margin-bottom:30px;
}

.infoTable th,
.infoTable td{
  padding:13px;
  border-bottom:1px solid var(--border);
  text-align:left;
}

.infoTable th{
  width:150px;
  background:#f8fafc;
}

.wikiSection{
  margin-top:30px;
}

.wikiSection h3{
  color:#111827;
  padding-bottom:10px;
  border-bottom:2px solid #e9edf4;
}

.wikiBody{
  line-height:1.8;
  white-space:pre-wrap;
}

.detailActions{
  display:flex;
  gap:10px;
  margin-top:30px;
}

.detailActions button{
  padding:10px 15px;
  border:0;
  border-radius:10px;
  cursor:pointer;
}

/* =========================
   모바일
========================= */

@media(max-width:700px){

  .wrap{
    width:92%;
    padding-top:35px;
  }

  .hero h1{
    font-size:30px;
  }

  .grid{
    grid-template-columns:repeat(2,1fr);
    gap:12px;
  }

  .adminPanel{
    width:82vw;
  }

  .detailPage{
    width:100vw;
    height:100vh;
    border-radius:0;
  }

  .detailHeader{
    padding:30px 20px 15px;
  }

  .detailHeader h2{
    font-size:25px;
  }

  .detailImageWrap{
    padding:0 20px;
  }

  .detailContent{
    padding:20px 20px 40px;
  }

  .infoTable th{
    width:100px;
  }

  .detailClose{
    top:15px;
    right:15px;
  }
}
</style>
</head>

<body>

<!-- =========================
     처음 비밀번호
========================= -->

<div id="lockScreen">

  <div class="lockBox">

    <h1>이펙필드 아카데미</h1>

    <p>
      입장하려면 비밀번호를 입력해주세요.
    </p>

    <input
      id="sitePassword"
      class="lockInput"
      type="password"
      placeholder="비밀번호"
      autocomplete="off"
      onkeydown="if(event.key==='Enter') unlock()"
    >

    <button
      class="primaryBtn"
      onclick="unlock()"
    >
      입장하기
    </button>

    <div
      id="lockError"
      class="errorText"
    ></div>

  </div>

</div>


<!-- =========================
     관리자 버튼
========================= -->

<button
  class="adminToggle"
  onclick="toggleAdminPanel()"
>
  &gt;
</button>

<div
  id="adminPanel"
  class="adminPanel"
>

  <h2>관리자</h2>

  <input
    id="adminPassword"
    type="password"
    placeholder="관리자 비밀번호"
  >

  <button onclick="unlockAdmin()">
    관리자 모드 켜기
  </button>

  <button onclick="disableAdmin()">
    관리자 모드 끄기
  </button>

  <div
    id="adminStatus"
    class="adminStatus"
  >
    일반 모드
  </div>

</div>


<!-- =========================
     메인
========================= -->

<main class="wrap">

  <header class="hero">

    <h1>이펙필드 아카데미</h1>

    <p>
      초능력을 올바른 곳에 사용하는 것을 목적으로 하는 다양한 분야의 아카데미
    </p>

  </header>


  <section
    id="createPanel"
    class="createPanel"
  >

    <button onclick="openFolderModal()">
      + 폴더 만들기
    </button>

    <button onclick="openItemModal()">
      + 정보 만들기
    </button>

  </section>


  <div class="toolbar">

    <button onclick="goHome()">
      🏠 전체 자료
    </button>

    <span id="currentPath"></span>

  </div>


  <section
    id="grid"
    class="grid"
  ></section>

</main>


<!-- =========================
     폴더 / 정보 생성 모달
========================= -->

<div
  id="modalBg"
  class="modalBg"
  onclick="if(event.target===this) closeModal()"
>

  <div class="modal">

    <h2 id="modalTitle"></h2>

    <div id="modalContent"></div>

  </div>

</div>


<!-- =========================
     상세 페이지
========================= -->

<div
  id="detailOverlay"
  class="detailOverlay"
  onclick="if(event.target===this) closeDetail()"
>

  <div
    id="detailPage"
    class="detailPage"
  ></div>

  <button
    class="detailClose"
    onclick="closeDetail()"
  >
    ×
  </button>

</div>


<!-- Supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* ==================================================
   기본 설정
================================================== */

const SITE_PASSWORD = "1234";

const ADMIN_PASSWORD = "Leeafnatureminna0103399";


/*
  ↓↓↓ Supabase를 사용할 경우 여기에 입력
*/

const SUPABASE_URL = "여기에_Project_URL";
const SUPABASE_KEY = "여기에_Publishable_Key";


let supabaseClient = null;


/* ==================================================
   기본 데이터
================================================== */

let data = {
  folders: [
    {
      id:"root",
      name:"전체 자료",
      parent:null
    }
  ],
  items:[]
};

let currentFolder = "root";
let adminMode = false;
let editingId = null;


/* ==================================================
   Supabase 초기화
================================================== */

function initSupabase(){

  if(
    !SUPABASE_URL ||
    !SUPABASE_KEY ||
    SUPABASE_URL.includes("여기에_") ||
    SUPABASE_KEY.includes("여기에_")
  ){
    console.warn("Supabase 설정이 아직 완료되지 않았습니다.");
    return false;
  }

  if(
    !window.supabase ||
    !window.supabase.createClient
  ){
    console.error("Supabase 라이브러리를 불러오지 못했습니다.");
    return false;
  }

  try{

    supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    return true;

  }catch(error){

    console.error(error);

    return false;
  }
}


/* ==================================================
   처음 비밀번호
================================================== */

function unlock(){

  const input =
    document.getElementById("sitePassword");

  const error =
    document.getElementById("lockError");

  const password =
    input.value;


  /*
    비밀번호가 맞으면 입장
  */

  if(password === SITE_PASSWORD){

    error.textContent = "";

    document.getElementById("lockScreen")
      .style.display = "none";


    /*
      비밀번호를 서버에 저장하거나
      특정 기기에 저장하지 않습니다.

      따라서 다른 기기에서도
      똑같이 1234를 입력하면 입장 가능.
    */


    /*
      Supabase 연결은
      비밀번호 확인 이후에만 실행
    */

    if(initSupabase()){

      loadData();

    }else{

      render();

    }

    return;
  }


  /*
    비밀번호가 틀렸을 때
  */

  error.textContent =
    "비밀번호가 맞지 않습니다";

  input.value = "";

  input.focus();
}


/* ==================================================
   시작
================================================== */

window.addEventListener("DOMContentLoaded",()=>{

  /*
    이전 로그인 기록을 확인하지 않습니다.

    즉,

    PC
    휴대폰
    태블릿
    다른 브라우저

    어디서든 처음에는 비밀번호를 입력합니다.
  */

  document
    .getElementById("sitePassword")
    .focus();

});


/* ==================================================
   관리자
================================================== */

function toggleAdminPanel(){

  document
    .getElementById("adminPanel")
    .classList.toggle("open");

}


function unlockAdmin(){

  const password =
    document.getElementById("adminPassword").value;

  if(password === ADMIN_PASSWORD){

    adminMode = true;

    document
      .getElementById("createPanel")
      .classList.add("active");

    document
      .getElementById("adminStatus")
      .textContent =
      "관리자 모드 활성화";

    render();

  }else{

    alert("관리자 비밀번호가 맞지 않습니다.");

  }

}


function disableAdmin(){

  adminMode = false;

  document
    .getElementById("createPanel")
    .classList.remove("active");

  document
    .getElementById("adminStatus")
    .textContent =
    "일반 모드";

  render();

}


/* ==================================================
   ID
================================================== */

function uid(){

  return Date.now().toString(36)
    + Math.random().toString(36).slice(2);

}


/* ==================================================
   HTML escape
================================================== */

function escapeHTML(value){

  if(value === undefined || value === null){
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* ==================================================
   데이터 불러오기
================================================== */

async function loadData(){

  if(!supabaseClient){

    render();

    return;
  }


  try{

    const result =
      await supabaseClient
        .from("academy_data")
        .select("data")
        .eq("id",1)
        .single();


    if(result.error){

      console.error(result.error);

      render();

      return;
    }


    if(result.data && result.data.data){

      data = result.data.data;

    }


    render();

  }catch(error){

    console.error(error);

    render();

  }

}


/* ==================================================
   데이터 저장
================================================== */

async function saveData(){

  if(!supabaseClient){

    alert(
      "Supabase 설정이 필요합니다.\n\n" +
      "SUPABASE_URL과 SUPABASE_KEY를 입력해주세요."
    );

    return false;
  }


  try{

    const result =
      await supabaseClient
        .from("academy_data")
        .update({
          data:data
        })
        .eq("id",1);


    if(result.error){

      console.error(result.error);

      alert(
        "데이터 저장 중 문제가 발생했습니다."
      );

      return false;
    }


    return true;

  }catch(error){

    console.error(error);

    return false;
  }

}


/* ==================================================
   폴더
================================================== */

function getCurrentFolder(){

  return data.folders.find(
    f => f.id === currentFolder
  );

}


function getFolderPath(){

  const path = [];

  let folder =
    getCurrentFolder();


  while(folder){

    path.unshift(folder);

    folder =
      data.folders.find(
        f => f.id === folder.parent
      );
  }


  return path;
}


function getChildFolders(parent){

  return data.folders.filter(
    f => f.parent === parent
  );

}


function goHome(){

  currentFolder = "root";

  render();

}


function openFolder(id){

  currentFolder = id;

  render();

}


/* ==================================================
   화면 출력
================================================== */

function render(){

  const grid =
    document.getElementById("grid");

  const path =
    document.getElementById("currentPath");


  const folders =
    getChildFolders(currentFolder);


  const items =
    data.items.filter(
      item => item.folder === currentFolder
    );


  const folderPath =
    getFolderPath();


  path.textContent =
    folderPath
      .map(f => f.name)
      .join(" / ");


  grid.innerHTML = "";


  folders.forEach(folder=>{

    const card =
      document.createElement("article");

    card.className = "card";

    card.innerHTML = `

      <div
        class="thumb"
        onclick="openFolder('${folder.id}')"
      >
        <div style="
          width:100%;
          height:100%;
          display:flex;
          align-items:center;
          justify-content:center;
          font-size:55px;
        ">
          📁
        </div>
      </div>

      <div class="cardbody">

        <h3>${escapeHTML(folder.name)}</h3>

        ${
          adminMode
          ? `
            <div class="cardactions">

              <button
                onclick="editFolder('${folder.id}')"
              >
                수정
              </button>

              <button
                onclick="deleteFolder('${folder.id}')"
              >
                삭제
              </button>

            </div>
          `
          : ""
        }

      </div>
    `;

    grid.appendChild(card);

  });


  items.forEach(item=>{

    const card =
      document.createElement("article");

    card.className = "card";


    const image =
      item.image
      ? `<img src="${item.image}" alt="">`
      : `
        <div style="
          width:100%;
          height:100%;
          display:flex;
          align-items:center;
          justify-content:center;
          color:#9aa5b5;
        ">
          이미지 없음
        </div>
      `;


    card.innerHTML = `

      <div
        class="thumb"
        onclick="showDetail('${item.id}')"
      >
        ${image}
      </div>

      <div class="cardbody">

        <h3>${escapeHTML(item.name)}</h3>

        ${
          item.grade
          ? `<p>${escapeHTML(item.grade)}</p>`
          : ""
        }

        ${
          adminMode
          ? `
            <div class="cardactions">

              <button
                onclick="editItem('${item.id}')"
              >
                수정
              </button>

              <button
                onclick="deleteItem('${item.id}')"
              >
                삭제
              </button>

            </div>
          `
          : ""
        }

      </div>

    `;

    grid.appendChild(card);

  });


  if(
    folders.length === 0 &&
    items.length === 0
  ){

    grid.innerHTML = `
      <div style="
        grid-column:1/-1;
        padding:70px 20px;
        text-align:center;
        color:#8792a5;
      ">
        아직 등록된 자료가 없습니다.
      </div>
    `;

  }

}


/* ==================================================
   폴더 생성
================================================== */

function openFolderModal(id=null){

  editingId = id;

  const folder =
    id
    ? data.folders.find(f=>f.id===id)
    : null;


  document.getElementById("modalTitle")
    .textContent =
    folder ? "폴더 수정" : "폴더 만들기";


  document.getElementById("modalContent")
    .innerHTML = `

      <div class="formGrid">

        <div class="row">

          <label>폴더 이름</label>

          <input
            id="folderName"
            value="${folder ? escapeHTML(folder.name) : ""}"
          >

        </div>

        <div class="modalfoot">

          <button
            onclick="closeModal()"
          >
            취소
          </button>

          <button
            onclick="saveFolder()"
          >
            저장
          </button>

        </div>

      </div>
    `;


  document
    .getElementById("modalBg")
    .classList.add("show");

}


function editFolder(id){

  openFolderModal(id);

}


async function saveFolder(){

  const name =
    document.getElementById("folderName")
      .value
      .trim();


  if(!name){

    alert("폴더 이름을 입력해주세요.");

    return;
  }


  if(editingId){

    const folder =
      data.folders.find(
        f=>f.id===editingId
      );

    if(folder){

      folder.name = name;

    }

  }else{

    data.folders.push({

      id:uid(),

      name:name,

      parent:currentFolder

    });

  }


  closeModal();

  render();

  await saveData();

}


async function deleteFolder(id){

  if(id === "root"){

    alert("전체 자료 폴더는 삭제할 수 없습니다.");

    return;
  }


  if(
    !confirm(
      "이 폴더를 삭제하시겠습니까?\n하위 자료도 함께 확인해주세요."
    )
  ){

    return;
  }


  data.folders =
    data.folders.filter(
      f=>f.id!==id
    );


  data.items =
    data.items.filter(
      item=>item.folder!==id
    );


  render();

  await saveData();

}

   정보 생성
================================================== */

function getFolderOptions(){

  return data.folders
    .filter(f=>f.id!=="root")

}


function openItemModal(id=null){

function editItem(id){

      </div>

        <input

        >

          ${
            item.image
            ? `<img class="preview" src="${item.image}">`
            : ""

        </button>

/* ==================================================
   이미지 미리보기
================================================== */

function previewUpload(event){

  const file =
    event.target.files[0];

  if(!file) return;


  const reader =
    new FileReader();


  reader.onload = function(e){

    document.getElementById("imagePreview")
      .innerHTML =
      `<img class="preview" src="${e.target.result}">`;

  };


  reader.readAsDataURL(file);

}


/* ==================================================
   이미지 업로드
================================================== */

async function uploadImage(file){

  if(!supabaseClient){

    throw new Error(
      "Supabase가 연결되지 않았습니다."
    );

  }


  const extension =
    file.name.split(".").pop();


  const path =
    `${uid()}.${extension}`;


  const result =
    await supabaseClient
      .storage
      .from("academy-images")
      .upload(
        path,
        file
      );


  if(result.error){

    throw result.error;

  }


  const publicUrl =
    supabaseClient
      .storage
      .from("academy-images")
      .getPublicUrl(path)
      .data
      .publicUrl;


  return publicUrl;

}


/* ==================================================
   정보 저장
================================================== */

async function saveItem(){

  const name =
    document.getElementById("itemName")
      .value
      .trim();


  if(!name){

    alert("이름을 입력해주세요.");

    return;
  }


  let image =
    editingId
    ? (
      data.items.find(
        i=>i.id===editingId
      )?.image || ""
    )
    : "";


  const file =
    document.getElementById("itemImage")
      .files[0];


  if(file){

    try{

      image =
        await uploadImage(file);

    }catch(error){

      console.error(error);

      alert(
        "이미지 업로드에 실패했습니다."
      );

      return;
    }

  }


  const itemData = {

    name:name,

    grade:
      document.getElementById("itemGrade").value,

    simple:
      document.getElementById("itemSimple").value,

    field:
      document.getElementById("itemField").value,

    ability:
      document.getElementById("itemAbility").value,

    likes:
      document.getElementById("itemLikes").value,

    dislikes:
      document.getElementById("itemDislikes").value,

    family:
      document.getElementById("itemFamily").value,

    relations:
      document.getElementById("itemRelations").value,

    extra:
      document.getElementById("itemExtra").value,

    image:image,

    folder:
      editingId
      ? (
        data.items.find(
          i=>i.id===editingId
        )?.folder || currentFolder
      )
      : currentFolder

  };


  if(editingId){

    const index =
      data.items.findIndex(
        i=>i.id===editingId
      );

    if(index !== -1){

      data.items[index] = {

        ...data.items[index],

        ...itemData

      };

    }

  }else{

    data.items.push({

      id:uid(),

      ...itemData

    });

  }


  closeModal();

  render();

  await saveData();

}


/* ==================================================
   정보 삭제
================================================== */

async function deleteItem(id){

  if(
    !confirm(
      "이 정보를 삭제하시겠습니까?"
    )
  ){

    return;
  }


  data.items =
    data.items.filter(
      i=>i.id!==id
    );


  render();

  await saveData();

}


/* ==================================================
   모달 닫기
================================================== */

function closeModal(){

  document
    .getElementById("modalBg")
    .classList.remove("show");

  editingId = null;

}
